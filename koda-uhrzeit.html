<style>

  ctx.strokeStyle=NOSE;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(97,-98);ctx.quadraticCurveTo(86,-93,76,-95);ctx.stroke();

/* ---------- Uhrzeit in Worten ---------- */
var HW=['zwölf','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf'];
function hw(h){return HW[((h-1)%12+12)%12+1];}
function words(h,m){
  var n=hw(h+1);
  switch(m){
    case 0: return (h%12===1?'ein':hw(h))+' Uhr';
    case 5: return 'fünf nach '+hw(h);
    case 10: return 'zehn nach '+hw(h);
    case 15: return 'viertel nach '+hw(h);
    case 20: return 'zwanzig nach '+hw(h);
    case 25: return 'fünf vor halb '+n;
    case 30: return 'halb '+n;
    case 35: return 'fünf nach halb '+n;
    case 40: return 'zwanzig vor '+n;
    case 45: return 'viertel vor '+n;
    case 50: return 'zehn vor '+n;
    case 55: return 'fünf vor '+n;
  }
}
function digital(h,m,day){return (day&&h<7?h+12:h)+':'+String(m).padStart(2,'0');}

];

function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

  mHand.setAttribute('transform','rotate('+ma+' 150 150)');hHand.setAttribute('transform','rotate('+ha+' 150 150)');
}
function angleOf(e){var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300-150,y=(e.clientY-r.top)/r.height*300-150;var a=Math.atan2(x,-y)*180/Math.PI;return (a+360)%360;}
function pick(e){
  // Welcher Zeiger? Nah an der Mitte der kurze, außen der lange; bei vollen Stunden nur der kurze
  if(R.L.step===60)return 'h';
  var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300-150,y=(e.clientY-r.top)/r.height*300-150,dist=Math.hypot(x,y),a=angleOf(e);
  function diff(b){var d=Math.abs(a-b)%360;return d>180?360-d:d;}
  var dh=diff((cur.h%12)*30+cur.m*.5),dm=diff(cur.m*6);
  if(dist<88&&dh<35)return 'h';
  if(dist>=88&&dm<35)return 'm';
  if(dh<35&&dist<110)return 'h';
  return dm<=dh?'m':'h';
}
svg.addEventListener('pointerdown',function(e){if(!interactive)return;e.preventDefault();dragging=pick(e);svg.setPointerCapture(e.pointerId);moveDrag(e);});
function moveDrag(e){
  if(!dragging)return;
  var a=angleOf(e),step=R.L.step;
  if(dragging==='m'){
    var stepM=Math.min(step,30),m=Math.round(a/6/stepM)*stepM%60;
    // Über die 12 gedreht: Stunde mitzählen
    if(cur.m>=45&&m<=15&&m!==cur.m)cur.h=cur.h%12+1;else if(cur.m<=15&&m>=45&&m!==cur.m)cur.h=(cur.h+10)%12+1;
    if(step===60)m=0;
    cur.m=m;
  }else{
    var h=Math.round((a-cur.m*.5)/30);h=((h%12)+12)%12;cur.h=h===0?12:h;
  }
  render();
}
svg.addEventListener('pointermove',moveDrag);
['pointerup','pointercancel'].forEach(function(ev){svg.addEventListener(ev,function(){dragging=null;});});
function animateTo(h,m,done){
  var from={h:cur.h,m:cur.m},t0=performance.now();
  var fa=(from.h%12)*60+from.m,ta=(h%12)*60+m;if(ta<fa)ta+=720;
  (function f(now){var k=Math.min(1,(now-t0)/900),e=1-Math.pow(1-k,3),v=fa+(ta-fa)*e;cur.h=Math.floor(v/60)%12||12;cur.m=Math.round(v%60);render();if(k<1)requestAnimationFrame(f);else{cur.h=h;cur.m=m;render();if(done)done();}})(t0);
}

/* ---------- Spielablauf ---------- */
var ROUND=10,R=null;
function show(id){['intro','play','end'].forEach(function(s){$(s).hidden=s!==id;});}
function start(li){
  R={L:LEVELS[li],li:li,i:0,first:0,tries:0,order:shuffle(EVENTS.slice()),locked:false};
  show('play');buildClock();next();
}
function makeTime(ev){
  var h24=ri(ev.h[0],ev.h[1]),h=((h24-1)%12)+1,step=R.L.step,m=step===60?0:ri(0,60/step-1)*step;
  // in höheren Stufen bevorzugt die neuen Minuten üben
  if(step===15&&Math.random()<.7)m=[15,45][ri(0,1)];
  if(step===5&&Math.random()<.7)m=[5,10,20,25,35,40,50,55][ri(0,7)];
  if(step===30&&Math.random()<.6)m=30;
  return {h:h,m:m,h24:h24};
}
function next(){
  if(R.i>=ROUND){finish();return;}
  var ev=R.order[R.i%R.order.length],tm=makeTime(ev),type=R.i%2===0?'set':'read';
  R.task={ev:ev,h:tm.h,m:tm.m,h24:tm.h24,type:type};R.tries=0;R.locked=false;
  var paws='';for(var i=0;i<ROUND;i++)paws+='<span class="'+(i<R.i?'done':i===R.i?'now':'')+'">🐾</span>';$('paws').innerHTML=paws;
  $('event').textContent=ev.e;
  $('feedback').textContent='';$('feedback').className='feedback';
  if(type==='set'){
    $('qtext').innerHTML='Um <em>'+words(tm.h,tm.m)+'</em> '+ev.t+'. Stell die Uhr!';
    $('digital').textContent=digital(tm.h,tm.m);$('digital').hidden=!R.L.digital;
    $('opts').hidden=true;$('setRow').hidden=false;$('clockhint').hidden=false;
    $('clockhint').textContent=R.L.step===60?'Zieh den kurzen Zeiger auf die richtige Stunde.':'Zieh den langen Zeiger für die Minuten und den kurzen für die Stunde.';
    interactive=true;
    // Startstellung: irgendeine andere Zeit
    cur.h=((tm.h+ri(2,8)-1)%12)+1;cur.m=0;render();
  }else{
    $('qtext').innerHTML='Schau auf die Uhr: Wann '+ev.t+'?';
    $('digital').hidden=true;$('setRow').hidden=true;$('opts').hidden=false;$('clockhint').hidden=true;
    interactive=false;cur.h=tm.h;cur.m=tm.m;render();
    var opts=distractors(tm.h,tm.m),box=$('opts');box.innerHTML='';
    opts.forEach(function(o){var b=document.createElement('button');b.type='button';b.className='btn opt';b.innerHTML='<b>'+digital(o.h,o.m)+'</b>'+words(o.h,o.m);b.addEventListener('click',function(){answerRead(o,b);});box.appendChild(b);});
  }
}
function distractors(h,m){
  var set={},out=[{h:h,m:m}];set[h+':'+m]=1;var step=R.L.step;
  var cands=[{h:h%12+1,m:m},{h:(h+10)%12+1,m:m},{h:h,m:(m+30)%60},{h:h,m:(60-m)%60},{h:m/5||12,m:(h%12)*5}];
  if(m===30)cands.push({h:h%12+1,m:30},{h:h,m:0});
  if(m===15||m===45)cands.push({h:h,m:60-m},{h:m===45?h%12+1:h,m:m===45?15:45});
  if(step===60)cands=[{h:h%12+1,m:0},{h:(h+10)%12+1,m:0},{h:(h+5)%12+1,m:0},{h:(h+2)%12+1,m:0}];
  shuffle(cands);
  cands.forEach(function(c){var k=c.h+':'+c.m;if(out.length<4&&!set[k]&&c.m%Math.min(step,30)===0||out.length<4&&!set[k]&&step===5&&c.m%5===0){set[k]=1;out.push(c);}});
  while(out.length<4){var c={h:ri(1,12),m:step===60?0:ri(0,60/Math.min(step,30)-1)*Math.min(step,30)},k=c.h+':'+c.m;if(!set[k]){set[k]=1;out.push(c);}}
  return shuffle(out);
}
var PRAISE=['Super!','Genau richtig!','Wau, toll!','Pünktlich wie Koda!','Klasse!'];
function correct(){
  R.locked=true;if(R.tries===0)R.first++;R.i++;
  $('feedback').textContent='🦴 '+PRAISE[ri(0,PRAISE.length-1)];$('feedback').className='feedback ok';
  happy();sfx.ok();setTimeout(next,1400);
}
function answerRead(o,b){
  if(R.locked||b.classList.contains('wrong'))return;
  if(o.h===R.task.h&&o.m===R.task.m){b.classList.add('right');correct();}
  else{R.tries++;b.classList.add('wrong');$('feedback').textContent='Schau noch mal genau auf die Zeiger.';$('feedback').className='feedback no';sfx.no();}
}
$('checkBtn').addEventListener('click',function(){
  if(R.locked)return;
  var t=R.task;
  if(cur.h===t.h&&cur.m===t.m){interactive=false;correct();return;}
  R.tries++;sfx.no();
  var hint=cur.m!==t.m?'Der lange Zeiger stimmt noch nicht.':'Der kurze Zeiger stimmt noch nicht.';
  if(R.tries>=2){R.locked=true;interactive=false;$('feedback').textContent='So wäre es richtig: '+words(t.h,t.m)+'.';$('feedback').className='feedback no';animateTo(t.h,t.m,function(){R.i++;setTimeout(next,1600);});}
  else{$('feedback').textContent=hint+' Probier es noch einmal.';$('feedback').className='feedback no';}
});
function finish(){
  show('end');
  var s=R.first>=9?3:R.first>=6?2:1,h='';for(var i=0;i<3;i++)h+=i<s?'⭐':'<span class="off">⭐</span>';$('stars').innerHTML=h;
  $('endTitle').textContent=['Gut gemacht!','Super gemacht!','Wau, perfekt!'][s-1];
  $('endText').textContent='Koda war den ganzen Tag pünktlich. '+R.first+' von 10 Aufgaben hast du gleich beim ersten Versuch gelöst.';
  var b=loadBest();if(!b[R.li]||s>b[R.li]){b[R.li]=s;try{localStorage.setItem('koda-uhr-best',JSON.stringify(b));}catch(e){}}
  celebrate=3;$('again').focus();
}
function loadBest(){try{return JSON.parse(localStorage.getItem('koda-uhr-best')||'{}');}catch(e){return {};}}
function showMenu(){show('intro');R=null;var b=loadBest(),p=[];LEVELS.forEach(function(l,i){if(b[i])p.push(l.name+' '+'⭐'.repeat(b[i]));});$('best').textContent=p.length?'Deine besten Runden · '+p.join(' · '):'';}
document.querySelectorAll('[data-level]').forEach(function(b){b.addEventListener('click',function(){start(+b.getAttribute('data-level'));});});
$('again').addEventListener('click',function(){start(R.li);});
$('menu').addEventListener('click',showMenu);

/* ---------- Ton ---------- */
var sound=false,actx=null;
function tone(f1,f2,d,type,v){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}
var sfx={ok:function(){tone(660,990,.12,'triangle',.12);setTimeout(function(){tone(880,1320,.15,'triangle',.1);},110);},no:function(){tone(220,160,.18,'sine',.08);}};
$('soundBtn').addEventListener('click',function(){sound=!sound;this.textContent=sound?'🔊':'🔇';this.setAttribute('aria-label',sound?'Ton und Musik ausschalten':'Ton und Musik einschalten');if(sound){sfx.ok();FunMusic.start('ruhig');}else FunMusic.stop();});

/* ---------- Szene mit Koda ---------- */
var kY=0,kV=0,wag=0,celebrate=0,hearts=[],W=480,H=150,GROUND=140;
function happy(){kV=-300;for(var i=0;i<4;i++)hearts.push({x:180+Math.random()*120,y:60,life:1.2});}
function drawScene(dt,t){
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#BFE3F2');g.addColorStop(1,'#EAF6E4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8BBF5E';ctx.fillRect(0,GROUND-6,W,H);
  ctx.fillStyle='rgba(255,236,170,.9)';ell(430,34,18,18);ctx.fill();
  kV+=1400*dt;kY+=kV*dt;if(kY>0){kY=0;kV=0;}
  if(celebrate>0){celebrate-=dt;if(kY===0&&Math.random()<dt*3)kV=-300;if(Math.random()<dt*5)hearts.push({x:100+Math.random()*280,y:80,life:1.4});}
  wag+=dt*(kY<0||celebrate>0?20:7);
  ctx.save();ctx.translate(200,GROUND+kY);ctx.scale(.7,.7);
  drawKoda(0,0,kY<0?0:Math.sin(t*1.5)*.2,kY<0,{stumble:0,wag:wag,y:kY,ball:false,blink:false});ctx.restore();
  for(var i=hearts.length-1;i>=0;i--){var p=hearts[i];p.life-=dt;p.y-=40*dt;ctx.globalAlpha=Math.max(0,Math.min(1,p.life));var x=p.x,y=p.y,r=7;ctx.fillStyle='#E84A6A';ctx.beginPath();ctx.moveTo(x,y+r*.6);ctx.bezierCurveTo(x-r*1.4,y-r*.4,x-r*.6,y-r*1.4,x,y-r*.5);ctx.bezierCurveTo(x+r*.6,y-r*1.4,x+r*1.4,y-r*.4,x,y+r*.6);ctx.fill();ctx.globalAlpha=1;if(p.life<=0)hearts.splice(i,1);}
}
function resize(){var r=cvs.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.width*H/W*d);if(w>0&&(cvs.width!==w||cvs.height!==h)){cvs.width=w;cvs.height=h;}}
window.addEventListener('resize',resize);
var last=performance.now();
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;if(!$('play').hidden){resize();drawScene(dt,now/1000);}requestAnimationFrame(loop);}
showMenu();requestAnimationFrame(loop);
window.KodaUhr={get round(){return R;},get clock(){return cur;},start:start,words:words};
})();
</script>
