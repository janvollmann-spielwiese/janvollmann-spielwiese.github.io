<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Weltspartag-Coup – Prompt-Escape-Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --surface2:#FAFAFA; --ink:#2E2E2E; --muted:#6B6B6B; --line:#DEDEDE;
  --red:#FF9B0F; --red-ink:#B05F00; --red-soft:#FFF1DC; --on-accent:#1E1E1E; --gold:#FF9B0F; --gold-soft:#FFF7EA;
  --ok:#2E8B57; --ok-soft:#E6F4EC; --door:#D6D6D6; --door2:#9A9A9A;
  --display:"Outfit", "Futura", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262626; --surface:#313131; --surface2:#3A3A3A; --ink:#F2F2F2; --muted:#B5B5B5; --line:#4A4A4A;
    --red:#FF9B0F; --red-ink:#FFB65A; --red-soft:#3E2E18; --on-accent:#1E1E1E; --gold:#FF9B0F; --gold-soft:#3A2F1F;
    --ok:#5CCB91; --ok-soft:#1E3A2B; --door:#4A4A4A; --door2:#6E6E6E;
  }
}
:root[data-theme="dark"]{
  --bg:#262626; --surface:#313131; --surface2:#3A3A3A; --ink:#F2F2F2; --muted:#B5B5B5; --line:#4A4A4A;
    --red:#FF9B0F; --red-ink:#FFB65A; --red-soft:#3E2E18; --on-accent:#1E1E1E; --gold:#FF9B0F; --gold-soft:#3A2F1F;
    --ok:#5CCB91; --ok-soft:#1E3A2B; --door:#4A4A4A; --door2:#6E6E6E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#fff;color:#3C3C3C;border-bottom:4px solid #FF9B0F;display:flex;align-items:center;gap:16px;padding:10px clamp(14px,3vw,32px);flex-wrap:wrap}
.bar .logo{height:34px;width:auto;display:block;flex:none}
.bar h1{color:#7A7A7A;font-weight:600!important;font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0;letter-spacing:-.01em;flex:1 1 auto}
.bar .team{font-weight:600;opacity:.92}
.clock{font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;background:#FF9B0F;color:#1E1E1E;padding:2px 12px;border-radius:999px;min-width:5.5ch;text-align:center}
.clock.warn{animation:pulse 1s infinite}
.clock.over{background:#3C3C3C;color:#fff}
@keyframes pulse{50%{background:#C66F00;color:#fff}}
.bar small{color:#6B6B6B;font-size:.85rem}
@media (max-width:560px){.bar h1{display:none}.bar .logo{height:28px}.bar .team{flex:1}}

/* Layout */
.stage{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,36px) clamp(14px,3vw,32px) 60px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.vaultbox{position:sticky;top:90px;text-align:center}
.vaultbox svg{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
.vaultbox p{margin:10px 0 0;color:var(--muted);font-size:.95rem}
.vaultbox strong{color:var(--ink);font-family:var(--display);font-size:1.6rem;display:block;line-height:1.1}
@media (max-width:760px){
  .stage{grid-template-columns:1fr}
  .vaultbox{position:static;display:flex;align-items:center;gap:16px;text-align:left}
  .vaultbox svg{width:96px;margin:0}
  .vaultbox p{margin:0}
}

/* Vault SVG */
.bolt{fill:var(--door2);transition:fill .5s, transform .6s}
.bolt.open{fill:var(--red)}
.ring{fill:var(--surface);stroke:var(--line);stroke-width:6}
.door{fill:var(--door)}
.door-inner{fill:none;stroke:var(--door2);stroke-width:3}
.handle{transform-origin:100px 100px;transition:transform 1.6s cubic-bezier(.6,-0.2,.3,1.2)}
.handle line{stroke:#7A7A7A;stroke-width:8;stroke-linecap:round}
.handle circle{fill:#FF9B0F}
.vault.open .handle{transform:rotate(540deg)}
.vault.open .door-g{transform-origin:20px 100px;animation:swing 1.2s 1.5s forwards ease-in-out}
@keyframes swing{to{transform:perspective(400px) rotateY(-70deg)}}
.pig{opacity:0;transition:opacity .6s 2s}
.vault.open .pig{opacity:1}

/* Screen content */
.screen h2{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.screen h3{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:28px 0 10px}
.kicker{color:var(--muted);font-weight:700;margin:0 0 6px;font-family:var(--display)}
.kicker::before{content:"\\";color:var(--red);font-weight:800;margin-right:8px;font-size:1.2em}
.lead{font-size:1.1rem;max-width:62ch}
.phantom{border-left:4px solid var(--red);background:var(--surface);padding:14px 18px;margin:0 0 22px;border-radius:0 12px 12px 0;display:flex;gap:12px;align-items:flex-start}
.phantom .ghost{font-size:1.6rem;line-height:1}
.phantom p{margin:0;font-style:italic}
.phantom b{font-style:normal;display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.task{font-weight:700;font-size:1.08rem;margin:20px 0 12px}

/* Context pieces */
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0 6px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px}
.msg.me{align-self:flex-end;background:var(--red);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg small{display:block;font-weight:700;font-size:.8rem;opacity:.75}
.file{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:520px}
.file .ico{width:40px;height:48px;border-radius:6px;background:#2B579A;color:#fff;font-weight:800;display:grid;place-items:center;font-family:var(--display);flex:none}
.file .name{font-weight:600;word-break:break-all}
.file .meta{color:var(--muted);font-size:.9rem}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 22px;font-family:Georgia,"Times New Roman",serif;line-height:1.7;max-width:620px;box-shadow:6px 6px 0 var(--line)}
.doc .dh{font-family:var(--body);font-size:.85rem;color:var(--muted);margin-bottom:6px}

/* Options */
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--red)}
.opt .letter{font-family:var(--display);font-weight:800;color:var(--red-ink);margin-right:8px}
.opt.wrong{border-color:var(--red);background:var(--red-soft);cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel{border-color:var(--red);background:var(--red-soft)}
.opt .why{display:block;margin-top:6px;font-size:.93rem;color:var(--ink)}
.opt:disabled{cursor:default}
label.opt{display:flex;gap:12px;align-items:flex-start}
label.opt input{width:20px;height:20px;margin-top:3px;accent-color:var(--red);flex:none}

.row{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.row.right{border-color:var(--ok);background:var(--ok-soft)}
.row.wrong{border-color:var(--red);background:var(--red-soft)}
.row .why{grid-column:1/-1;font-size:.93rem}
select{padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--surface2);min-width:140px}
.tf{display:flex;gap:6px}
.tf button{border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.tf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:560px){.row{grid-template-columns:1fr}}

.group{margin-bottom:18px}
.group h4{margin:0 0 8px;font-family:var(--display);font-size:1.05rem}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;max-width:100%}
.pill[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.pill.right{border-color:var(--ok);background:var(--ok-soft)}

/* Buttons & feedback */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.btn{border:none;border-radius:4px;padding:12px 26px;font-weight:700;cursor:pointer;background:var(--red);color:var(--on-accent);font-family:var(--display);letter-spacing:.01em;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{font-family:var(--body);background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.feedback{margin-top:16px;padding:12px 16px;border-radius:12px;display:none}
.feedback.show{display:block}
.feedback.bad{background:var(--red-soft)}
.feedback.good{background:var(--ok-soft)}
.hint{margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--gold-soft);border:2px dashed var(--gold)}
.lesson{margin-top:22px;padding:20px 22px;border-radius:16px;background:var(--surface);border:2px solid var(--gold)}
.lesson{border-left-width:8px}
.lesson b{font-family:var(--display);font-size:1.1rem;display:block;margin-bottom:4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

input[type=text]{width:100%;max-width:420px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.rules{display:grid;gap:8px;padding:0;margin:18px 0;list-style:none;max-width:62ch}
.rules li{padding-left:28px;position:relative}
.rules li::before{content:"\\";position:absolute;left:4px;color:var(--red);font-weight:800;font-family:var(--display);font-size:1.2em;line-height:1.3}
.prompt-out{background:var(--surface);border:2px solid var(--ok);border-radius:12px;padding:16px 18px;white-space:pre-wrap}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:16px 0}
.stats div{font-size:.95rem;color:var(--muted)}
.stats strong{display:block;font-family:var(--display);font-size:2rem;color:var(--ink);line-height:1.1}
.cheat{counter-reset:c;list-style:none;padding:0;display:grid;gap:10px}
.cheat li{background:var(--surface);border-radius:12px;padding:12px 16px 12px 52px;position:relative;border:1px solid var(--line)}
.cheat li::before{counter-increment:c;content:counter(c);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--on-accent);font-weight:800;display:grid;place-items:center;font-size:.9rem}
.foot{max-width:1100px;margin:0 auto;padding:0 clamp(14px,3vw,32px) 40px;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  ],
  hint:"Feedback an die KI ist wie Feedback an Kollegen: Es hilft nur, wenn es konkret sagt, was sich ändern soll.",

},
{

{

  <h3>Die Zusammenfassung vom KIPilot</h3>`,

  options:[
    {t:"Weltspartag: Freitag, 30.10., von 9 bis 16 Uhr.", ok:false, why:"Stimmt mit dem Dokument überein. Sucht weiter!"},
    {t:"Kinder bis 12 bekommen ein Sparschwein, 200 Stück sind vorrätig.", ok:false, why:"Stimmt mit dem Dokument überein. Sucht weiter!"},

{

const FINAL = {
  title:"Der Tresor: Euer Master-Prompt",
  phantom:"Respekt, Sparfüchse. Aber das Tresorschloss will einen letzten Beweis: einen perfekten Prompt. Ich hab natürlich ein paar Fallen eingebaut.",
  task:"Ziel: eine kurze Mail ans Filialteam, wer am Weltspartag welche Schicht übernimmt, auf Basis der hochgeladenen Word-Datei. Wählt pro Baustein die beste Variante.",
  groups:[
    {name:"Rolle", opts:[
      {t:"Du bist die beste KI der Welt.", ok:false},
      {t:"Du bist Assistenz der Filialleitung einer Sparkasse.", ok:true},
      {t:"Du bist ein Pirat.", ok:false}]},
    {name:"Aufgabe", opts:[
      {t:"Mach was mit der Datei.", ok:false},
      {t:"Erstelle aus dem Schichtplan im angehängten Dokument (Kapitel 5) eine interne Mail an das Filialteam.", ok:true},
      {t:"Erstelle eine Mail an alle Kunden.", ok:false}]},
    {name:"Kontext", opts:[
      {t:"Lena hat Personalnummer 48213 und ist diese Woche krank.", ok:false},
      {t:"Kein Kontext nötig, die KI weiß das schon.", ok:false},
      {t:"Der Weltspartag ist am 30.10. Das Team kennt den Ablauf bereits, es geht nur um die Schichten.", ok:true}]},
    {name:"Format", opts:[
      {t:"Betreff, kurze Begrüßung und eine Tabelle mit Name, Uhrzeit und Aufgabe.", ok:true},
      {t:"Irgendwie halt.", ok:false},
      {t:"Ein Gedicht in zwölf Strophen.", ok:false}]},
    {name:"Ton", opts:[
      {t:"Drohend, damit alle pünktlich sind.", ok:false},
      {t:"Juristisch einwandfrei im Stil eines Vertrags.", ok:false},
      {t:"Freundlich und kollegial, per du.", ok:true}]}
  ]
};

/* ---------- State ---------- */
const TOTAL = 30*60, HINT_COST = 60;
const S = {team:"", level:-1, start:0, penalty:0, hints:0, solved:0, hintShown:false, done:false, endTime:0, overNotified:false};
const $ = s => document.querySelector(s);
const screen = $("#screen");
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const fmt = s => { s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };

/* ---------- Vault ---------- */
(function drawBolts(){
  let g = "";
  for(let i=0;i<6;i++){
    const ang = i*60 - 90;
    g += `<rect class="bolt" id="bolt${i}" x="96" y="26" width="8" height="18" rx="3" transform="rotate(${ang+90} 100 100)"/>`;
  }
  $("#bolts").innerHTML = g;
})();
function updateVault(){
  for(let i=0;i<6;i++) document.getElementById("bolt"+i).classList.toggle("open", i < S.solved);
  $("#progressNum").textContent = S.solved + " / 6";
}

/* ---------- Timer ---------- */
function elapsed(){ return S.start ? ((S.done ? S.endTime : Date.now()) - S.start)/1000 + S.penalty : 0; }
function tick(){
  if(!S.start) return;
  const rem = TOTAL - elapsed(), c = $("#clock");
  if(rem >= 0){
    c.textContent = fmt(rem); c.classList.toggle("warn", rem < 120); c.classList.remove("over");
    $("#clockLabel").textContent = "bis Filialöffnung";
  } else {
    c.textContent = "+" + fmt(-rem); c.classList.add("over"); c.classList.remove("warn");
    $("#clockLabel").textContent = "Die Filiale ist offen! Verlängerung:";
    if(!S.overNotified && !S.done){ S.overNotified = true; toast("8:00 Uhr: Die Filialleitung steht in der Tür. Egal, spielt weiter!"); }
  }
}
setInterval(tick, 500);

function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3800);
}

/* ---------- Screens ---------- */
function intro(){
  screen.innerHTML = `
    <p class="kicker">Ein Prompt-Escape-Game von WG-DATA</p>
    <h2>Donnerstag, 29. Oktober, 7:30 Uhr.</h2>
    <p class="lead">Morgen ist Weltspartag, und in eurer Filiale geht gar nichts mehr. Über Nacht hat sich das <strong>Prompt-Phantom</strong> in den S-KIPilot geschlichen und den Tresor mit 200 Sparschweinen verriegelt.</p>
    <div class="phantom"><span class="ghost">👻</span><p><b>Nachricht vom Prompt-Phantom</b>Sechs Riegel, ein Tresor. Ich geb die Sparschweine erst frei, wenn ihr beweist, dass ihr prompten könnt. Um 8:00 Uhr kommt eure Filialleitung. Tick, tack.</p></div>
    <ul class="rules">
      <li>Spielt zu zweit bis viert an einem Bildschirm und diskutiert jede Antwort kurz. Genau da passiert das Lernen.</li>
      <li>Falsche Antworten kosten nichts, sie zeigen euch, warum etwas nicht klappt.</li>
      <li>Tipps gibt es jederzeit, aber jeder kostet eine Minute auf der Uhr.</li>
      <li>Nach jedem Riegel bekommt ihr einen Merksatz. Am Ende habt ihr euren Prompt-Spickzettel komplett.</li>
    </ul>
    <label for="team" style="font-weight:700;display:block;margin-bottom:6px">Wie heißt euer Team?</label>
    <input type="text" id="team" maxlength="30" placeholder="z. B. Die Zinsknacker">
    <div class="actions"><button class="btn" id="go">Mission starten</button></div>`;
  $("#go").onclick = () => {
    S.team = ($("#team").value.trim() || "Team Sparfuchs");
    $("#teamLabel").textContent = S.team;
    S.start = Date.now(); S.level = 0; render();
  };
  $("#team").addEventListener("keydown", e => { if(e.key==="Enter") $("#go").click(); });
}

function header(L, idx){
  return `<p class="kicker">${idx < 6 ? "Riegel " + (idx+1) + " von 6" : "Finale"}</p>
    <h2>${L.title.replace(/^Riegel \d: /,"")}</h2>
    <div class="phantom"><span class="ghost">👻</span><p><b>Nachricht vom Prompt-Phantom</b>${L.phantom}</p></div>
    ${L.story ? `<p>${L.story}</p>` : ""}
    ${L.context || ""}
    <p class="task">${L.task}</p>`;
}
function footer(withCheck){
  return `<div class="actions">
      ${withCheck ? `<button class="btn" id="check">Antwort prüfen</button>` : ""}
      <button class="btn ghost" id="hintBtn">Tipp holen (kostet 1 Minute)</button>
    </div>
    <div id="hintBox"></div>
    <div class="feedback" id="fb"></div>
    <div id="after"></div>`;
}
function wireHint(text){
  $("#hintBtn").onclick = () => {
    if(S.hintShown) return;
    S.hintShown = true; S.hints++; S.penalty += HINT_COST; tick();
    $("#hintBox").innerHTML = `<div class="hint">💡 ${text}</div>`;
    $("#hintBtn").disabled = true; $("#hintBtn").style.opacity=.5;
  };
}
function feedback(msg, good){
  const fb = $("#fb"); fb.className = "feedback show " + (good ? "good" : "bad"); fb.innerHTML = msg;
  if(!good){ fb.classList.remove("shake"); void fb.offsetWidth; fb.classList.add("shake"); }
}
function solved(L){
  S.solved++; updateVault();
  const chk = $("#check"); if(chk) chk.remove();
  $("#hintBtn").remove();
  const last = S.level === 5;
  $("#after").innerHTML = `<div class="lesson"><b>🔓 Riegel offen! Euer Merksatz:</b>${L.lesson}</div>
    <div class="actions"><button class="btn" id="next">${last ? "Zum Tresor" : "Nächster Riegel"}</button></div>`;
  $("#next").onclick = () => { S.level++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  $("#next").focus({preventScroll:true});
}

function render(){
  S.hintShown = false;
  if(S.level === 6) return finalRoom();
  const L = LEVELS[S.level];
  const letters = "ABCDEF";
  let body = "";
  if(L.type === "choice"){
    body = `<div class="opts">${L.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${letters[i]}</span>${o.t}<span class="why"></span></button>`).join("")}</div>`;
    screen.innerHTML = header(L, S.level) + body + footer(false);
    screen.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = L.options[+b.dataset.i];
      b.querySelector(".why").textContent = o.why;
      if(o.ok){
        b.classList.add("right");
        screen.querySelectorAll(".opt").forEach(x => x.disabled = true);
        $("#fb").className = "feedback";
        solved(L);
      } else {
        b.classList.add("wrong"); b.disabled = true;
        feedback("Nicht ganz. Lest die Begründung und versucht's nochmal.", false);
      }
    });
  }
  if(L.type === "match"){
    body = `<div class="opts">${L.items.map((it,i)=>`<div class="row" data-i="${i}"><span>${it.t}</span>
      <select aria-label="Baustein ${i+1}"><option value="">Bitte wählen</option>${L.cats.map(c=>`<option>${c}</option>`).join("")}</select></div>`).join("")}</div>`;
    screen.innerHTML = header(L, S.level) + body + footer(true);
    $("#check").onclick = () => {
      let right = 0;
      screen.querySelectorAll(".row").forEach(r => {
        const ok = r.querySelector("select").value === L.items[+r.dataset.i].a;
        r.classList.toggle("right", ok); r.classList.toggle("wrong", !ok); if(ok) right++;
      });
      if(right === L.items.length){ $("#fb").className="feedback"; screen.querySelectorAll("select").forEach(s=>s.disabled=true); solved(L); }
      else feedback(`${right} von ${L.items.length} sitzen. Die rot markierten Bausteine brauchen noch eine andere Zuordnung.`, false);
    };
  }
  if(L.type === "multi"){
    body = `<div class="opts">${L.options.map((o,i)=>`<label class="opt"><input type="checkbox" data-i="${i}"><span>${o.t}</span></label>`).join("")}</div>`;
    screen.innerHTML = header(L, S.level) + body + footer(true);
    $("#check").onclick = () => {
      let allOk = true;
      screen.querySelectorAll("input[type=checkbox]").forEach(cb => {
        if(cb.checked !== L.options[+cb.dataset.i].ok) allOk = false;
      });
      if(allOk){
        screen.querySelectorAll("input[type=checkbox]").forEach(cb => { cb.disabled = true; if(cb.checked) cb.closest(".opt").classList.add("right"); });
        $("#fb").className="feedback"; solved(L);
      } else feedback(L.bad, false);
    };
  }
  if(L.type === "tf"){
    body = `<div class="opts">${L.items.map((it,i)=>`<div class="row" data-i="${i}"><span>${it.t}</span>
      <div class="tf" role="group" aria-label="Aussage ${i+1}"><button data-v="1" aria-pressed="false">Wahr</button><button data-v="0" aria-pressed="false">Falsch</button></div>
      <span class="why"></span></div>`).join("")}</div>`;
    screen.innerHTML = header(L, S.level) + body + footer(true);
    screen.querySelectorAll(".tf button").forEach(b => b.onclick = () => {
      b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
    });
    $("#check").onclick = () => {
      let right = 0, missing = 0;
      screen.querySelectorAll(".row").forEach(r => {
        const it = L.items[+r.dataset.i], p = r.querySelector('[aria-pressed="true"]');
        if(!p){ missing++; r.classList.remove("right","wrong"); r.querySelector(".why").textContent=""; return; }
        const ok = (p.dataset.v === "1") === it.a;
        r.classList.toggle("right", ok); r.classList.toggle("wrong", !ok);
        r.querySelector(".why").textContent = it.why; if(ok) right++;
      });
      if(missing){ feedback(`Noch ${missing} Aussage${missing>1?"n":""} ohne Entscheidung.`, false); return; }
      if(right === L.items.length){ $("#fb").className="feedback"; screen.querySelectorAll(".tf button").forEach(b=>b.disabled=true); solved(L); }
      else feedback(`${right} von ${L.items.length} richtig. Lest die Erklärungen bei den roten Aussagen und entscheidet neu.`, false);
    };
  }
  wireHint(L.hint);
}

function finalRoom(){
  const F = FINAL;
  const groups = F.groups.map((g,gi)=>({...g, opts: shuffle(g.opts.map((o,oi)=>({...o,oi})))}));
  const body = groups.map((g,gi)=>`<div class="group"><h4>${g.name}</h4><div class="pills" role="group" aria-label="${g.name}">
      ${g.opts.map(o=>`<button class="pill" data-g="${gi}" data-ok="${o.ok?1:0}" aria-pressed="false">${o.t}</button>`).join("")}</div></div>`).join("");
  screen.innerHTML = header(F, 6) + body + footer(true);
  screen.querySelectorAll(".pill").forEach(p => p.onclick = () => {
    p.parentElement.querySelectorAll(".pill").forEach(x => x.setAttribute("aria-pressed","false"));
    p.setAttribute("aria-pressed","true");
  });
  wireHint("Denkt an alles, was ihr gelernt habt: konkrete Aufgabe mit Bezug aufs Dokument, keine persönlichen Daten, klares Format, passender Ton für Kollegen.");
  $("#check").onclick = () => {
    const chosen = groups.map((g,gi)=>screen.querySelector(`.pill[data-g="${gi}"][aria-pressed="true"]`));
    const missing = chosen.filter(c=>!c).length;
    if(missing){ feedback(`Noch ${missing} Baustein${missing>1?"e":""} ohne Auswahl.`, false); return; }
    const right = chosen.filter(c=>c.dataset.ok==="1").length;
    if(right < 5){ feedback(`Das Schloss klickt ${right}-mal … aber es braucht 5 Treffer. Das Phantom lacht. Mindestens eine Falle ist noch drin.`, false); return; }
    chosen.forEach(c=>c.classList.add("right"));
    S.done = true; S.endTime = Date.now(); tick();
    const prompt = chosen.map(c=>c.textContent.trim()).join("\n");
    $("#vault").classList.add("open");
    setTimeout(()=>ending(prompt), 2600);
    feedback("Klick. Klick. Klick. Klick. KLACK. 🎉", true);
    $("#check").remove(); $("#hintBtn").remove();
  };
}

function ending(prompt){
  const t = elapsed(), inTime = t <= TOTAL;
  const rank = t <= 20*60 ? "Tresor-Legenden 🏆" : inTime ? "Prompt-Profis 🥇" : "Spätschicht-Helden 🌙";
  screen.innerHTML = `
    <p class="kicker">Tresor geöffnet</p>
    <h2>${esc(S.team)}: ${rank}</h2>
    <p class="lead">${inTime ? "Um Punkt acht steht die Filialleitung in der Tür und findet: 200 Sparschweine, einen fertigen Aushang, eine kinderfreundliche Einladung und eine Schicht-Mail. Das Prompt-Phantom hat sich beleidigt in den Papierkorb verzogen." : "Die Filialleitung war schon da, aber als sie den offenen Tresor und euren Master-Prompt sieht, gibt's trotzdem Kaffee für alle. Das Phantom ist geschlagen."}</p>
    <div class="phantom"><span class="ghost">👻</span><p><b>Letzte Nachricht vom Prompt-Phantom</b>Pff. Mit so guten Prompts macht Sabotieren echt keinen Spaß mehr. Schönen Weltspartag.</p></div>
    <div class="stats">
      <div><strong>${fmt(t)}</strong>Minuten gebraucht (inkl. Tipps)</div>
      <div><strong>${S.hints}</strong>Tipp${S.hints===1?"":"s"} genutzt</div>
      <div><strong>6 / 6</strong>Riegel geknackt</div>
    </div>
    <h3>Euer Master-Prompt</h3>
    <div class="prompt-out">${esc(prompt)}</div>
    <h3>Euer Prompt-Spickzettel</h3>
    <ol class="cheat">${LEVELS.map(l=>`<li>${l.lesson}</li>`).join("")}</ol>
    <div class="actions"><button class="btn" id="again">Nochmal spielen</button></div>`;
  $("#again").onclick = () => location.reload();
  window.scrollTo({top:0,behavior:"smooth"});
}

updateVault();
intro();
</script>
</body>
</html>
