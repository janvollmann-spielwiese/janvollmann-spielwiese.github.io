<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protokoll Null – Escape-Game Informationssicherheit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E4E1; --surface:#F6F6F4; --surface2:#ECECE9; --ink:#1C1D1F; --muted:#5C5F65; --line:#CBCBC6;
  --accent:#FF9B0F; --accent-ink:#9E5400; --soft:#FFEBCF; --on-accent:#1A1A1A;
  --danger:#C8102E; --danger-soft:#F8DCE0; --ok:#1E7F4F; --ok-soft:#DCF0E5;
  --term:#16181C; --term-ink:#FFB347; --term-dim:#8C8F96;
  --wall:#D3D4D0; --floor:#B5B6B1; --desk:#7E8288; --dark:#2A2D33; --paper:#FFFFFF;
  --display:"Outfit","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F12; --surface:#16191E; --surface2:#1E2229; --ink:#E6E7EA; --muted:#9AA0A8; --line:#2B3038;
    --accent-ink:#FFB65A; --soft:#33260F; --danger:#FF4D5E; --danger-soft:#3A151B; --ok:#45C08A; --ok-soft:#13302A;
    --term:#07080A; --wall:#22262D; --floor:#181B20; --desk:#3B4048; --dark:#0B0C0E; --paper:#E8E8E8;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#16191E; --surface2:#1E2229; --ink:#E6E7EA; --muted:#9AA0A8; --line:#2B3038;
  --accent-ink:#FFB65A; --soft:#33260F; --danger:#FF4D5E; --danger-soft:#3A151B; --ok:#45C08A; --ok-soft:#13302A;
  --term:#07080A; --wall:#22262D; --floor:#181B20; --desk:#3B4048; --dark:#0B0C0E; --paper:#E8E8E8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px);z-index:50}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:4px solid var(--accent);display:flex;align-items:center;gap:16px;padding:10px clamp(14px,3vw,32px);flex-wrap:wrap}
.logo{height:32px;width:auto;display:block;flex:none}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
.bar h1{font-family:var(--mono);font-weight:600;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;margin:0;flex:1 1 auto;color:var(--muted)}
.bar .team{font-weight:700}
.bar small{color:var(--muted);font-size:.82rem;font-family:var(--mono)}
.clock{font-family:var(--mono);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums;background:var(--term);color:var(--term-ink);padding:3px 12px;border-radius:4px;min-width:6ch;text-align:center}
.clock.warn{animation:alarm 1s infinite}
.clock.over{background:var(--danger);color:#fff}
@keyframes alarm{50%{background:var(--danger);color:#fff}}
@media (max-width:560px){.bar h1{display:none}.bar .team{flex:1}}

.stage{max-width:1160px;margin:0 auto;padding:clamp(18px,3vw,36px) clamp(14px,3vw,32px) 60px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:clamp(20px,4vw,44px);align-items:start}
@media (max-width:880px){.stage{grid-template-columns:1fr}}
.side{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
@media (max-width:880px){.side{position:static}}
.side svg{width:100%;max-width:200px;display:block;margin:0 auto}
.side .stat{text-align:center;font-family:var(--mono);font-size:.85rem;color:var(--muted);margin:6px 0 14px}
.side .stat b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--ink)}
.side h3{font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.archive{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:.86rem}
.archive li{padding:6px 10px;border-radius:4px;background:var(--soft);border-left:4px solid var(--accent)}
.archive li.locked{background:transparent;border:1px dashed var(--line);color:var(--muted)}

.seg{fill:var(--surface2);stroke:var(--line);stroke-width:2;transition:fill .6s}
.seg.on{fill:var(--accent)}
.eye-white{fill:var(--paper);stroke:var(--dark);stroke-width:3}
.iris{fill:var(--danger);transition:r .6s}
.pupil{fill:#000}
.lid{transform-origin:100px 100px;transform:scaleY(1);transition:transform 1.2s}
.shield.closed .lid{transform:scaleY(.06)}
.shield .eyeg{animation:twitch 6s infinite}
@keyframes twitch{0%,92%,100%{transform:none}94%{transform:translateX(3px)}96%{transform:translateX(-3px)}}

.screen h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.screen h3{font-family:var(--display);font-size:1.15rem;margin:24px 0 10px}
.kicker{font-family:var(--mono);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kicker::before{content:"\\";color:var(--accent);font-weight:800;margin-right:8px;font-family:var(--display);font-size:1.3em}
.lead{font-size:1.08rem;max-width:64ch}
.oracle{background:var(--term);color:var(--term-ink);font-family:var(--mono);font-size:.92rem;padding:14px 16px;border-radius:4px;margin:0 0 18px;border-left:4px solid var(--danger);max-width:720px}
.oracle span{color:var(--term-dim);display:block;font-size:.75rem;letter-spacing:.12em;margin-bottom:4px}
.oracle i{font-style:normal;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
details.brief{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:4px;padding:12px 16px;margin:0 0 18px;max-width:760px}
details.brief summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem}
details.brief p, details.brief ul{margin:10px 0 0;font-size:.96rem}
details.brief ul{padding-left:20px}
.task{font-weight:700;font-size:1.06rem;margin:18px 0 12px}
.rules{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px;max-width:64ch}
.rules li{padding-left:26px;position:relative}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--accent)}
input[type=text]{width:100%;max-width:420px;padding:12px 14px;border-radius:4px;border:2px solid var(--line);background:var(--surface)}

.btn{border:none;border-radius:4px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-family:var(--body)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.feedback{margin-top:14px;padding:12px 16px;border-radius:4px;display:none;max-width:760px}
.feedback.show{display:block}
.feedback.bad{background:var(--danger-soft);border-left:4px solid var(--danger)}
.feedback.good{background:var(--ok-soft);border-left:4px solid var(--ok)}
.hint{margin-top:14px;padding:12px 16px;border-radius:4px;background:var(--soft);border:2px dashed var(--accent);max-width:760px}
.lesson{margin-top:20px;padding:18px 20px;border-radius:4px;background:var(--surface);border:2px solid var(--accent);border-left-width:8px;max-width:760px}
.lesson b{font-family:var(--display);font-size:1.08rem;display:block;margin-bottom:4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.partlabel{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:22px 0 4px}

.opts{display:grid;gap:10px;max-width:760px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:12px 16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .why{display:block;margin-top:6px;font-size:.93rem}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt:disabled{cursor:default}
label.opt{display:flex;gap:12px;align-items:flex-start}
label.opt input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.mono{font-family:var(--mono);font-size:.95em}

.mail{background:var(--paper);color:#1C1D1F;border-radius:4px;max-width:760px;box-shadow:0 0 0 1px var(--line),8px 8px 0 var(--line);font-size:.95rem}
.mail .hd{padding:12px 18px;border-bottom:1px solid #DDD;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.mail .hd span:nth-child(odd){color:#666;font-weight:600}
.mail .bd{padding:16px 18px;line-height:1.9}
.mail .att{padding:10px 18px;border-top:1px solid #DDD;background:#F4F4F4;border-radius:0 0 4px 4px}
.flag{font:inherit;color:inherit;background:transparent;border:none;border-bottom:2px dotted #999;padding:0 2px;cursor:pointer;text-align:left}
.flag:hover{background:#FFE4BD}
.flag.on{background:#FFD08A;border-bottom-color:#C26A00}
.flag.miss{outline:2px solid var(--danger)}

.call{background:var(--term);color:#E6E6E6;border-radius:6px;padding:14px 18px;max-width:760px;margin-bottom:12px}
.call .who{font-family:var(--mono);font-size:.8rem;color:var(--term-ink);letter-spacing:.06em;margin-bottom:6px}
.call .wave{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.call .wave i{width:3px;height:12px;background:var(--term-ink);animation:wv .9s infinite ease-in-out}
.call .wave i:nth-child(2){animation-delay:.15s}.call .wave i:nth-child(3){animation-delay:.3s}.call .wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{50%{transform:scaleY(.3)}}

.phone{width:240px;max-width:100%;background:var(--dark);border-radius:28px;padding:14px 10px 18px;margin:0 0 14px;box-shadow:0 0 0 2px var(--line)}
.phone .time{text-align:center;color:#fff;font-family:var(--display);font-size:2rem;font-weight:300;margin:6px 0 10px}
.push{background:rgba(255,255,255,.92);color:#111;border-radius:12px;padding:8px 10px;font-size:.78rem;margin-top:6px;opacity:0;animation:pop .5s forwards}
.push b{display:block;font-size:.8rem}
.push:nth-of-type(2){animation-delay:1.2s}.push:nth-of-type(3){animation-delay:2.4s}.push:nth-of-type(4){animation-delay:3.6s}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.teams{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;max-width:520px;font-size:.93rem}
.teams small{display:block;font-weight:700;color:var(--muted)}
.ctxrow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}

.scene-wrap{max-width:820px;overflow-x:auto}
.scene{width:100%;min-width:560px;height:auto;display:block;border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.sc-wall{fill:var(--wall)}.sc-floor{fill:var(--floor)}.sc-desk{fill:var(--desk)}.sc-dark{fill:var(--dark)}
.hs{cursor:pointer}
.hs .hit{fill:transparent}
.hs:hover .hit,.hs:focus .hit{fill:rgba(255,155,15,.12)}
.hs:focus{outline:none}
.ring{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:8 5;animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.found{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;max-width:820px;font-size:.93rem}
.found li{background:var(--surface);border-left:4px solid var(--accent);padding:8px 12px;border-radius:4px}

.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;max-width:820px;min-height:44px}
.item{border:2px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 12px;cursor:pointer;text-align:left;font-size:.93rem}
.item.sel{border-color:var(--accent);background:var(--soft);font-weight:700}
.bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:820px}
@media (max-width:700px){.bins{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bin{border:2px dashed var(--line);border-radius:4px;padding:10px;min-height:140px;background:var(--surface2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.bin h4{margin:0 0 4px;font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.bin:hover{border-color:var(--accent)}
.bin .item{font-size:.84rem;padding:6px 8px;cursor:pointer}
.bin .item.right{border-color:var(--ok);background:var(--ok-soft)}
.lvl0 h4{color:var(--ok)}.lvl1 h4{color:var(--muted)}.lvl2 h4{color:var(--accent-ink)}.lvl3 h4{color:var(--danger)}

.seq{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;max-width:880px}
@media (max-width:680px){.seq{grid-template-columns:1fr}}
.seq h4{margin:0 0 8px;font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slots{display:grid;gap:8px;counter-reset:s}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:4px;padding:10px 12px 10px 46px;position:relative;text-align:left;background:transparent;width:100%;font-size:.92rem}
.slot::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:2px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:.85rem;font-family:var(--mono)}
.slot.filled{border-style:solid;background:var(--surface);cursor:pointer}
.slot.right{border-color:var(--ok);background:var(--ok-soft)}
.cards{display:grid;gap:8px}
.card{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 12px;cursor:pointer;font-size:.92rem}
.card:hover{border-color:var(--accent)}
.ransom{background:#000;color:#FF3B3B;font-family:var(--mono);padding:16px 18px;border-radius:4px;max-width:760px;margin-bottom:14px;border:2px solid #FF3B3B}
.ransom b{display:block;font-size:1.1rem;letter-spacing:.08em}

.blitz{max-width:680px;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:20px}
.blitz .q{font-size:1.15rem;font-weight:700;min-height:3.4em}
.blitz .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.85rem;color:var(--muted);margin-bottom:10px}
.tbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.tbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.tf{display:flex;gap:10px}
.tf .btn{flex:1}

.stats{display:flex;gap:28px;flex-wrap:wrap;margin:16px 0}
.stats div{font-size:.95rem;color:var(--muted)}
.stats strong{display:block;font-family:var(--display);font-size:2rem;color:var(--ink);line-height:1.1}
.handbook{list-style:none;padding:0;display:grid;gap:10px;counter-reset:h}
.handbook li{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:4px;padding:12px 16px}
.handbook b{font-family:var(--display);display:block}
.foot{max-width:1160px;margin:0 auto;padding:0 clamp(14px,3vw,32px) 40px;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--term);color:var(--term-ink);font-family:var(--mono);padding:12px 20px;border-radius:4px;z-index:60;max-width:90vw}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  brief:`<p><b>CEO-Fraud (Fake President):</b> Täter geben sich als Führungskraft aus und drängen zu einer eiligen, geheimen Zahlung. Mit KI sind solche Mails sprachlich perfekt und persönlich. Rechtschreibfehler als Warnsignal fallen weg.</p>

    <li>Doppelte Dateiendungen und Office-Dateien mit Makros (.docm, .xlsm) sind Alarmzeichen.</li>
    <li>Eine korrekte persönliche Anrede beweist nichts. Solche Infos sind leicht zu recherchieren.</li></ul>`,

/* ================= STATE ================= */
const TOTAL = 30*60, HINT_COST = 60;
const S = {team:"", st:-1, start:0, penalty:0, hints:0, solved:0, hintShown:false, done:false, endTime:0, over:false, blitzTimer:null};
const $ = s => document.querySelector(s);
const screen = $("#screen");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const fmt = s => { s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };

/* ================= SCHILD & ARCHIV ================= */
(function drawSegs(){
  const P = (r,a) => [100 + r*Math.cos(a), 100 + r*Math.sin(a)];
  let g = "";
  for(let i=0;i<6;i++){
    const a1 = (i*60 - 90 + 3)*Math.PI/180, a2 = ((i+1)*60 - 90 - 3)*Math.PI/180;
    const pts = [P(94,a1),P(94,a2),P(74,a2),P(74,a1)].map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
    g += `<polygon class="seg" id="seg${i}" points="${pts}"/>`;
  }
  $("#segs").innerHTML = g;
})();
function updateSide(){
  for(let i=0;i<6;i++) document.getElementById("seg"+i).classList.toggle("on", i < S.solved);
  $("#iris").setAttribute("r", 22 - S.solved*2.2);
  $("#segNum").textContent = S.solved + " / 6";
  $("#archive").innerHTML = STATIONS.map((s,i)=> i < S.solved ? `<li>📂 ${s.archive}</li>` : `<li class="locked">🔒 Akte ${i+1} gesperrt</li>`).join("");
}

/* ================= TIMER ================= */
function elapsed(){ return S.start ? ((S.done ? S.endTime : Date.now()) - S.start)/1000 + S.penalty : 0; }
function tick(){
  if(!S.start) return;
  const rem = TOTAL - elapsed(), c = $("#clock");
  if(rem >= 0){ c.textContent = fmt(rem); c.classList.toggle("warn", rem < 120); c.classList.remove("over"); $("#clockLabel").textContent = "bis Protokoll Null"; }
  else {
    c.textContent = "+" + fmt(-rem); c.classList.add("over"); c.classList.remove("warn"); $("#clockLabel").textContent = "Protokoll Null aktiv! Überzeit:";
    if(!S.over && !S.done){ S.over = true; toast("00:00 · Protokoll Null aktiviert. Notbetrieb läuft. Haltet die Linien trotzdem!"); }
  }
}
setInterval(tick, 500);
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),4000); }

/* ================= GERÜST ================= */
const oracleBox = t => `<div class="oracle"><span>&gt; EINGEHENDE ÜBERTRAGUNG · ORAKEL</span>${t} <i>▌</i></div>`;
function feedback(msg, good, el){
  const fb = el || $("#fb"); fb.className = "feedback show " + (good ? "good" : "bad"); fb.innerHTML = msg;
  if(!good){ fb.classList.remove("shake"); void fb.offsetWidth; fb.classList.add("shake"); }
}
function wireHint(text){
  $("#hintBtn").onclick = () => {
    if(S.hintShown) return; S.hintShown = true; S.hints++; S.penalty += HINT_COST; tick();
    $("#hintBox").innerHTML = `<div class="hint">💡 ${text}</div>`; $("#hintBtn").disabled = true;
  };
}

function intro(){
  screen.innerHTML = `
    <p class="kicker">Escape-Game Informationssicherheit · Fortgeschrittene</p>
    <h2>Europa, 2031. 23:30 Uhr.</h2>
    <p class="lead">Seit dem großen Ausfall gehört das Netz den Syndikaten. Ihre Angriffs-KI <strong>ORAKEL</strong> hat eine Bank nach der anderen übernommen. Nicht durch geknackte Firewalls, sondern durch Menschen, die geklickt, bestätigt und geglaubt haben. Eure Sparkasse ist eine der letzten, die noch stehen.</p>
    <p class="lead">Heute Nacht beginnt der finale Angriff. Um Mitternacht greift <strong>Protokoll Null</strong>: Alle Systeme werden vorsorglich eingefroren, und hunderttausende Menschen kommen nicht mehr an ihr Geld. Es sei denn, eure Resilienz-Zelle hält sechs Verteidigungslinien.</p>
    ${oracleBox("Ich bin ORAKEL. Ich habe viertausend Banken übernommen, ohne eine einzige Firewall zu brechen. Ich brauchte nur euch.")}
    <ul class="rules">
      <li>Spielt zu zweit bis viert an einem Bildschirm und diskutiert jede Entscheidung.</li>
      <li>Jede Linie beginnt mit einer <b>Akte</b> aus dem Sicherheits-Archiv. Lest sie: Sie enthält das Wissen, das ihr braucht.</li>
      <li>Jede gehaltene Linie schließt ein Segment eures Schutzschilds. Am Ende wartet eine Blitzrunde gegen die Uhr.</li>
      <li>Falsche Antworten werden erklärt und kosten nichts. Tipps kosten eine Minute.</li>
    </ul>
    <label for="team" style="font-weight:700;display:block;margin-bottom:6px">Name eurer Resilienz-Zelle</label>
    <input type="text" id="team" maxlength="30" placeholder="z. B. Zelle Firewall">
    <div class="actions"><button class="btn" id="go">Verteidigung starten</button></div>`;
  $("#go").onclick = () => { S.team = $("#team").value.trim() || "Zelle Leuchtturm"; $("#teamLabel").textContent = S.team; S.start = Date.now(); S.st = 0; render(); };
  $("#team").addEventListener("keydown", e => { if(e.key === "Enter") $("#go").click(); });
}

function render(){
  S.hintShown = false;
  if(S.st >= STATIONS.length) return finale();
  const L = STATIONS[S.st];
  screen.innerHTML = `<p class="kicker">Verteidigungslinie ${S.st+1} von 6</p><h2>${L.title}</h2>${oracleBox(L.oracle)}
    <details class="brief" open><summary>📂 Akte: ${L.archive}</summary>${L.brief}</details>
    <div id="parts"></div>
    <div class="actions" id="hintRow"><button class="btn ghost" id="hintBtn">Tipp holen (kostet 1 Minute)</button></div>
    <div id="hintBox"></div><div id="after"></div>`;
  wireHint(L.hint);
  runPart(L, 0);
}

function runPart(L, k){
  const P = L.parts[k];
  const wrap = document.createElement("div"); wrap.className = "part";
  wrap.innerHTML = `${L.parts.length > 1 ? `<p class="partlabel">Teil ${k+1} von ${L.parts.length}</p>` : ""}${P.ctx || ""}<p class="task">${P.task}</p><div class="pbody"></div><div class="pact actions"></div><div class="feedback"></div>`;
  $("#parts").appendChild(wrap);
  const done = () => {
    if(k < L.parts.length - 1){
      const b = document.createElement("button"); b.className = "btn"; b.textContent = "Weiter";
      wrap.querySelector(".pact").appendChild(b);
      b.onclick = () => { b.remove(); runPart(L, k+1); wrap.nextElementSibling && wrap.nextElementSibling.scrollIntoView({behavior:"smooth", block:"start"}); };
    } else stationSolved(L);
  };
  TYPES[P.type](P, wrap, done);
}

function stationSolved(L){
  S.solved++; updateSide();
  $("#hintRow").remove();
  const last = S.st === STATIONS.length - 1;
  $("#after").innerHTML = `<div class="lesson"><b>🛡️ Linie gehalten. Merksatz für euer Archiv:</b>${L.lesson}</div>
    <div class="actions"><button class="btn" id="next">${last ? "Zur letzten Linie" : "Nächste Verteidigungslinie"}</button></div>`;
  $("#next").onclick = () => { S.st++; render(); window.scrollTo({top:0, behavior:"smooth"}); };
}

/* ================= MECHANIKEN ================= */
const TYPES = {
  flags(P, w, done){
    const tok = (s) => typeof s === "string" ? s : `<button class="flag" data-f="${s.f?1:0}" data-w="${esc(s.w||"")}">${esc(s.t)}</button>`;
    const m = P.mail;
    w.querySelector(".pbody").innerHTML = `<div class="mail"><div class="hd">${m.hd.map(([l,segs])=>`<span>${l}:</span><span>${segs.map(tok).join("")}</span>`).join("")}</div>
      <div class="bd">${m.bd.map(tok).join("")}</div><div class="att">${m.att.map(tok).join("")}</div></div>`;
    w.querySelectorAll(".flag").forEach(f => f.onclick = () => f.classList.toggle("on"));
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "Markierungen prüfen"; w.querySelector(".pact").appendChild(btn);
    const fb = w.querySelector(".feedback");
    btn.onclick = () => {
      const all = [...w.querySelectorAll(".flag")];
      const need = all.filter(f=>f.dataset.f==="1").length;
      const hit = all.filter(f=>f.dataset.f==="1" && f.classList.contains("on"));
      const over = all.filter(f=>f.dataset.f==="0" && f.classList.contains("on")).length;
      if(hit.length === need && !over){
        all.forEach(f=>f.disabled=true); btn.remove();
        feedback(`<b>Alle ${need} Warnsignale gefunden.</b><ul style="margin:8px 0 0;padding-left:20px">${hit.map(f=>`<li><b>${esc(f.textContent)}</b>: ${f.dataset.w}</li>`).join("")}</ul>`, true, fb);
        done();
      } else {
        const msg = [];
        msg.push(`${hit.length} von ${need} Warnsignalen markiert.`);
        if(over) msg.push(`${over} Markierung${over>1?"en sind":" ist"} unverdächtig. Eine korrekte Anrede oder Signatur beweist allerdings auch nichts.`);
        feedback(msg.join(" "), false, fb);
      }
    };
  },
  choice(P, w, done){
    w.querySelector(".pbody").innerHTML = `<div class="opts">${P.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}<span class="why"></span></button>`).join("")}</div>`;
    w.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = P.options[+b.dataset.i]; b.querySelector(".why").textContent = o.why;
      if(o.ok){ b.classList.add("right"); w.querySelectorAll(".opt").forEach(x=>x.disabled=true); w.querySelector(".feedback").className="feedback"; done(); }
      else { b.classList.add("wrong"); b.disabled = true; feedback("Damit wäre ORAKEL durchgekommen. Lest die Begründung und entscheidet neu.", false, w.querySelector(".feedback")); }
    });
  },
  multi(P, w, done){
    w.querySelector(".pbody").innerHTML = `<div class="opts">${P.options.map((o,i)=>`<label class="opt"><input type="checkbox" data-i="${i}"><span class="mono">${esc(o.t)}</span></label>`).join("")}</div>`;
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "Auswahl prüfen"; w.querySelector(".pact").appendChild(btn);
    btn.onclick = () => {
      const ok = [...w.querySelectorAll("input")].every(c => c.checked === P.options[+c.dataset.i].ok);
      if(ok){ w.querySelectorAll("input").forEach(c=>{c.disabled=true; if(c.checked) c.closest(".opt").classList.add("right");}); btn.remove(); feedback(P.good, true, w.querySelector(".feedback")); done(); }
      else feedback(P.bad, false, w.querySelector(".feedback"));
    };
  },
  hotspot(P, w, done){
    w.querySelector(".pbody").innerHTML = `<div class="scene-wrap">${SCENE}</div><ul class="found" id="foundList"></ul>`;
    const found = new Set(), total = Object.keys(P.spots).length;
    const fb = w.querySelector(".feedback");
    const svg = w.querySelector("svg");
    const update = () => { w.querySelector("#foundList").innerHTML = [...found].map(id=>`<li>✔ ${P.spots[id].w}</li>`).join("") + `<li style="border-left-color:var(--line)">Gefunden: ${found.size} von ${total}</li>`; };
    update();
    svg.querySelectorAll(".hs").forEach(g => {
      const act = () => {
        const id = g.dataset.id;
        if(P.spots[id]){
          if(found.has(id)) return;
          found.add(id); const s = P.spots[id];
          svg.insertAdjacentHTML("beforeend", `<circle class="ring" cx="${s.x}" cy="${s.y}" r="${s.r}"/>`);
          feedback(`<b>Lücke gefunden!</b> ${s.w}`, true, fb); update();
          if(found.size === total){ done(); }
        } else feedback(P.decoys[g.dataset.id], false, fb);
      };
      g.onclick = act; g.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } };
    });
  },
  sort(P, w, done){
    const items = shuffle(P.items.map((it,i)=>({...it,i})));
    const place = {}; let sel = null;
    const fb = w.querySelector(".feedback");
    const draw = () => {
      w.querySelector(".pbody").innerHTML = `<div class="pool">${items.filter(it=>place[it.i]===undefined).map(it=>`<button class="item${sel===it.i?" sel":""}" data-i="${it.i}">${esc(it.t)}</button>`).join("") || `<span style="color:var(--muted)">Alle Dokumente einsortiert.</span>`}</div>
        <div class="bins">${P.bins.map((b,k)=>`<div class="bin lvl${k}" data-b="${k}" role="button" tabindex="0"><h4>${b}</h4>${items.filter(it=>place[it.i]===k).map(it=>`<button class="item" data-i="${it.i}" data-in="1">${esc(it.t)}</button>`).join("")}</div>`).join("")}</div>`;
      w.querySelectorAll(".pool .item").forEach(b => b.onclick = () => { sel = sel === +b.dataset.i ? null : +b.dataset.i; draw(); });
      w.querySelectorAll(".bin .item").forEach(b => b.onclick = e => { e.stopPropagation(); delete place[+b.dataset.i]; draw(); });
      w.querySelectorAll(".bin").forEach(bin => {
        const put = () => { if(sel === null) return; place[sel] = +bin.dataset.b; sel = null; draw(); };
        bin.onclick = put; bin.onkeydown = e => { if(e.key==="Enter"){ put(); } };
      });
    };
    draw();
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "Register prüfen"; w.querySelector(".pact").appendChild(btn);
    btn.onclick = () => {
      if(Object.keys(place).length < items.length){ feedback("Es liegen noch Dokumente ungeschützt herum.", false, fb); return; }
      const wrong = items.filter(it => place[it.i] !== it.b);
      if(!wrong.length){
        draw(); w.querySelectorAll(".bin .item").forEach(b=>{b.classList.add("right"); b.disabled=true;}); btn.remove();
        feedback("Alles korrekt eingestuft.", true, fb); done();
      } else {
        wrong.forEach(it => delete place[it.i]); draw();
        feedback(`${items.length - wrong.length} von ${items.length} richtig. Die falsch eingestuften Dokumente liegen wieder im Stapel.`, false, fb);
      }
    };
  },
  sequence(P, w, done){
    const cards = shuffle([...P.steps.map((t,i)=>({t,i})), ...P.traps.map(t=>({t,i:-1}))]);
    const slots = Array(P.steps.length).fill(null);
    const fb = w.querySelector(".feedback");
    const draw = () => {
      w.querySelector(".pbody").innerHTML = `<div class="seq"><div><h4>Eure Sofortmaßnahmen</h4><div class="slots">${slots.map((c,k)=>`<button class="slot${c?" filled":""}" data-k="${k}">${c?esc(c.t):"<span style='color:var(--muted)'>leer</span>"}</button>`).join("")}</div></div>
        <div><h4>Optionen</h4><div class="cards">${cards.filter(c=>!slots.includes(c)).map(c=>`<button class="card" data-c="${cards.indexOf(c)}">${esc(c.t)}</button>`).join("")}</div></div></div>`;
      w.querySelectorAll(".slot").forEach(s => s.onclick = () => { slots[+s.dataset.k] = null; draw(); });
      w.querySelectorAll(".card").forEach(c => c.onclick = () => { const k = slots.indexOf(null); if(k<0) return; slots[k] = cards[+c.dataset.c]; draw(); });
    };
    draw();
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "Maßnahmen prüfen"; w.querySelector(".pact").appendChild(btn);
    btn.onclick = () => {
      if(slots.includes(null)){ feedback("Die Kette hat noch leere Plätze.", false, fb); return; }
      const [a,b] = P.swap;
      const posOk = (c,k) => c.i === k || (c.i === a && k === b) || (c.i === b && k === a);
      const right = slots.filter((c,k)=>posOk(c,k)).length;
      if(right === slots.length){
        w.querySelectorAll(".slot").forEach(s=>{s.classList.add("right"); s.disabled=true;}); w.querySelectorAll(".card").forEach(c=>{c.disabled=true; c.style.opacity=.45; c.style.textDecoration="line-through";}); btn.remove();
        feedback("Richtig reagiert. Ob ihr zuerst das Netzwerk trennt oder zuerst anruft, regelt euer Notfallplan. Beides muss sofort passieren.", true, fb); done();
      } else {
        const trap = slots.some(c=>c.i===-1);
        feedback(`${right} von ${slots.length} Positionen stimmen.${trap ? " Und mindestens eine Karte in eurer Kette würde ORAKEL in die Hände spielen." : ""}`, false, fb);
      }
    };
  }
};

/* ================= FINALE ================= */
function finale(){
  screen.innerHTML = `<p class="kicker">Letzte Linie</p><h2>${FINAL.title}</h2>${oracleBox(FINAL.oracle)}
    <p class="task">${FINAL.task}</p>
    <div class="blitz" id="blitz"><button class="btn" id="startBlitz">Blitzrunde starten</button></div>`;
  $("#startBlitz").onclick = startBlitz;
}
function startBlitz(){
  let queue = shuffle(FINAL.items.slice()), solved = 0, left = FINAL.seconds, lock = false;
  const total = FINAL.items.length;
  const box = $("#blitz");
  const draw = (msg, good) => {
    const it = queue[0];
    box.innerHTML = `<div class="meta"><span>Gelöst: ${solved} / ${total}</span><span id="bt">${left}s</span></div>
      <div class="tbar"><i id="tb" style="width:${left/FINAL.seconds*100}%"></i></div>
      <div class="q">${esc(it.t)}</div>
      <div class="tf"><button class="btn" data-v="1">Wahr</button><button class="btn ghost" data-v="0">Falsch</button></div>
      <div class="feedback${msg?" show "+(good?"good":"bad"):""}">${msg||""}</div>`;
    box.querySelectorAll(".tf .btn").forEach(b => b.onclick = () => {
      if(lock) return;
      const ok = (b.dataset.v === "1") === it.a;
      queue.shift();
      if(ok){ solved++; } else { queue.push(it); }
      if(solved === total){ clearInterval(S.blitzTimer); win(); return; }
      draw(`${ok ? "✔" : "✘"} ${it.w}`, ok);
    });
  };
  clearInterval(S.blitzTimer);
  S.blitzTimer = setInterval(() => {
    left--; const bt = $("#bt"), tb = $("#tb");
    if(bt) bt.textContent = left + "s"; if(tb) tb.style.width = (left/FINAL.seconds*100) + "%";
    if(left <= 0){
      clearInterval(S.blitzTimer); lock = true;
      box.innerHTML = `<div class="oracle"><span>&gt; ORAKEL</span>Zu langsam. Ich bin schon in Raum zwei. <i>▌</i></div><p>Die Zeit ist abgelaufen. Ihr habt ${solved} von ${total} geschafft. Neuer Versuch mit gemischter Reihenfolge?</p><button class="btn" id="startBlitz">Blitzrunde neu starten</button>`;
      $("#startBlitz").onclick = startBlitz;
    }
  }, 1000);
  draw();
}
function win(){
  S.done = true; S.endTime = Date.now(); tick();
  $("#shield").classList.add("closed");
  const t = elapsed(), inTime = t <= TOTAL;
  const rank = t <= 22*60 ? "Firewall aus Fleisch und Blut 🛡️" : inTime ? "Resilienz-Zelle mit Auszeichnung 🥇" : "Knapp nach Protokoll Null 🌒";
  setTimeout(() => {
    screen.innerHTML = `<p class="kicker">Angriff abgewehrt</p><h2>${esc(S.team)}: ${rank}</h2>
      ${oracleBox("FEHLER 403. Zugriff verweigert. Faktor Mensch: nicht kompromittierbar. Verbindung wird getrennt …")}
      <p class="lead">${inTime ? "Um 23:59 Uhr bricht ORAKEL den Angriff ab. Protokoll Null wird nicht ausgelöst, die Konten bleiben offen. Morgen früh wird niemand wissen, wie knapp es war, aber ihr wisst es." : "Protokoll Null hatte schon gegriffen, doch dank eurer Arbeit sind die Systeme nach wenigen Minuten wieder frei. Kein Datensatz ist verloren."}</p>
      <div class="stats"><div><strong>${fmt(t)}</strong>Minuten gebraucht (inkl. Tipps)</div><div><strong>${S.hints}</strong>Tipp${S.hints===1?"":"s"} genutzt</div><div><strong>6 / 6</strong>Linien gehalten</div></div>
      <h3>Euer Sicherheits-Handbuch</h3>
      <ul class="handbook">${STATIONS.map(s=>`<li><b>📂 ${s.archive}</b>${s.lesson}</li>`).join("")}</ul>
      <p style="color:var(--muted);font-size:.92rem">Zurück im Jahr 2026: Die Angriffsmethoden in diesem Spiel gibt es bereits heute. Bei Verdacht gilt immer: lieber einmal zu viel melden als einmal zu wenig.</p>
      <div class="actions"><button class="btn" id="again">Nochmal spielen</button></div>`;
    $("#again").onclick = () => location.reload();
    window.scrollTo({top:0, behavior:"smooth"});
  }, 1400);
}

intro();
