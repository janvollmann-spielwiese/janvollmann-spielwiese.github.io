<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level 1: Dein erster Tag in der Sparkasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EF; --surface:#FFFFFF; --surface2:#F7F6F3; --ink:#232323; --muted:#666; --line:#E2E0DB;
  --accent:#FF9B0F; --accent-ink:#A35800; --soft:#FFF0DA; --on-accent:#1A1A1A;
  --A:#FF9B0F; --E:#2F80ED; --S:#EB4F7F; --K:#7B5CFA;
  --A-soft:#FFF0DA; --E-soft:#E3EEFD; --S-soft:#FDE5EC; --K-soft:#ECE7FF;
  --ok:#1E8A55; --ok-soft:#E1F4EA; --bad:#D23C3C; --bad-soft:#FBE4E4;
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181B; --surface:#212328; --surface2:#2A2D33; --ink:#EEEEF0; --muted:#A4A7AE; --line:#363940;
  --accent-ink:#FFB65A; --soft:#3A2B14; --A-soft:#3A2B14; --E-soft:#17283F; --S-soft:#3B1A26; --K-soft:#261F45;
  --ok:#4CC88A; --ok-soft:#163327; --bad:#FF6B6B; --bad-soft:#3A1C1C;
}}
:root[data-theme="dark"]{
  --bg:#17181B; --surface:#212328; --surface2:#2A2D33; --ink:#EEEEF0; --muted:#A4A7AE; --line:#363940;
  --accent-ink:#FFB65A; --soft:#3A2B14; --A-soft:#3A2B14; --E-soft:#17283F; --S-soft:#3B1A26; --K-soft:#261F45;
  --ok:#4CC88A; --ok-soft:#163327; --bad:#FF6B6B; --bad-soft:#3A1C1C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:4px solid var(--accent);padding:10px clamp(14px,3vw,32px)}
.bar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:30px;width:auto;display:block}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
.bar .title{font-family:var(--display);font-weight:600;color:var(--muted);flex:1}
.xp{display:none;align-items:center;gap:10px;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 12px}
.xp.on{display:flex}
.xp .lv{font-family:var(--display);font-weight:700;font-size:.9rem;white-space:nowrap}
.xp .track{width:120px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xp .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#FFC15E);transition:width .6s}
.xp .num{font-family:var(--display);font-weight:800;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 10px;font-size:.85rem}
@media (max-width:640px){.bar .title{display:none}.xp{flex:1;justify-content:space-between}.xp .track{flex:1;width:auto}}
.nav{display:none;max-width:1120px;margin:10px auto 0;gap:6px}
.nav.on{display:flex}
.nav button{border:none;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}

main{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(14px,3vw,32px) 60px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,3rem);line-height:1.05;letter-spacing:-.025em;margin:0 0 14px}
h3{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:28px 0 10px}
.kicker{font-family:var(--display);font-weight:700;color:var(--muted);margin:0 0 8px}
.kicker::before{content:"\\";color:var(--accent);font-weight:800;margin-right:8px;font-size:1.25em}
.lead{font-size:1.12rem;max-width:62ch;color:var(--ink)}
.muted{color:var(--muted)}
.btn{border:none;border-radius:12px;padding:13px 24px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-size:1.02rem;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
input[type=text],textarea{width:100%;max-width:420px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
textarea{max-width:none;min-height:80px;resize:vertical}

.avatars{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.av{width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:1.6rem;cursor:pointer;display:grid;place-items:center}
.av[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);transform:scale(1.06)}

.qcard{background:var(--surface);border-radius:24px;padding:clamp(18px,4vw,32px);max-width:760px;box-shadow:0 1px 0 var(--line)}
.dots{display:flex;gap:6px;margin-bottom:14px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.2;margin:0 0 18px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .12s}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.choice .ic{font-size:1.4rem;flex:none}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--surface2);display:none}
.explain.show{display:block}

.typecard{border-radius:24px;padding:clamp(20px,4vw,34px);color:#1A1A1A;max-width:820px;position:relative;overflow:hidden}
.typecard .suit{position:absolute;right:-10px;top:-30px;font-size:11rem;opacity:.18;line-height:1}
.typecard h2{margin-bottom:6px}
.mix{display:grid;gap:8px;max-width:520px;margin:18px 0}
.mix div{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-weight:700;font-size:.92rem}
.mix .b{height:10px;border-radius:5px;background:rgba(0,0,0,.12);overflow:hidden}
.mix .b i{display:block;height:100%;background:#1A1A1A}

.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.bento{grid-template-columns:1fr}}
.tile{position:relative;text-align:left;border:none;border-radius:24px;padding:22px;cursor:pointer;min-height:220px;display:flex;flex-direction:column;gap:8px;overflow:hidden;transition:transform .15s, box-shadow .15s;color:var(--ink)}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.tile .suit{position:absolute;right:14px;top:6px;font-size:5rem;opacity:.15;line-height:1}
.tile .tag{font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}
.tile h4{font-family:var(--display);font-weight:800;font-size:1.55rem;margin:0;line-height:1.1}
.tile p{margin:0;font-size:.97rem}
.tile .prog{margin-top:auto;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.88rem}
.tile .prog .b{flex:1;height:8px;border-radius:4px;background:rgba(127,127,127,.25);overflow:hidden}
.tile .prog .b i{display:block;height:100%}
.tile .rec{position:absolute;left:22px;top:-1px;background:var(--ink);color:var(--bg);font-weight:800;font-size:.75rem;padding:3px 10px;border-radius:0 0 8px 8px}
.tile.rec-on{padding-top:34px}
.tA{background:var(--A-soft)}.tA .tag,.tA .prog .b i{color:var(--A);background:var(--A)}.tA .tag{background:none}
.tE{background:var(--E-soft)}.tE .tag{color:var(--E)}.tE .prog .b i{background:var(--E)}
.tS{background:var(--S-soft)}.tS .tag{color:var(--S)}.tS .prog .b i{background:var(--S)}
.tK{background:var(--K-soft)}.tK .tag{color:var(--K)}.tK .prog .b i{background:var(--K)}
.tA .tag{color:var(--accent-ink)}
.hubhead{display:flex;gap:16px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.bigav{width:72px;height:72px;border-radius:22px;background:var(--surface);display:grid;place-items:center;font-size:2.4rem;flex:none}
.endrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;background:var(--surface);border-radius:20px;padding:16px 20px}

.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:820px}
@media (max-width:640px){.levels{grid-template-columns:1fr}}
.lvl{border:none;border-radius:20px;padding:18px;text-align:left;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:4px;border:2px solid var(--line)}
.lvl b{font-family:var(--display);font-size:1.2rem}
.lvl .medal{font-size:2rem}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl.done{border-color:var(--ok)}

.explore{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.explore{grid-template-columns:1fr}}
.map{background:var(--surface);border-radius:24px;padding:10px}
.map svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node circle.bg{fill:var(--surface2);stroke:var(--line);stroke-width:2;transition:fill .2s,stroke .2s}
.node:hover circle.bg,.node:focus circle.bg{stroke:var(--E)}
.node.seen circle.bg{fill:var(--E-soft);stroke:var(--E)}
.node text{font-family:var(--body);font-size:11px;font-weight:700;fill:var(--ink)}
.node text.emo{font-size:24px}
.node:focus{outline:none}
.link{stroke:var(--line);stroke-width:2;stroke-dasharray:4 4}
.center circle{fill:var(--accent)}
.center text{fill:#1A1A1A;font-family:var(--display);font-weight:800}
.secret{cursor:pointer}
.secret text{fill:var(--muted);opacity:.38;font-family:var(--display);font-weight:700}
.secret:hover text{opacity:.8}
.secret.found text{fill:var(--E);opacity:1}
.panel{background:var(--surface);border-radius:24px;padding:22px;position:sticky;top:120px}
@media (max-width:860px){.panel{position:static}}
.panel .em{font-size:2.4rem}
.panel h4{font-family:var(--display);font-size:1.4rem;margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:var(--surface2);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700}
.chips span.on{background:var(--E-soft);color:var(--E)}

.sliders{background:var(--surface);border-radius:24px;padding:22px;max-width:820px}
.sl{display:grid;grid-template-columns:180px 1fr 84px;gap:12px;align-items:center;margin:10px 0}
@media (max-width:560px){.sl{grid-template-columns:1fr 84px}.sl input{grid-column:1/-1;grid-row:2}}
.sl input{accent-color:var(--E);width:100%}
.sl output{font-family:var(--display);font-weight:800;text-align:right;white-space:nowrap}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0;font-weight:700}
.flow span{background:var(--surface2);border-radius:12px;padding:8px 12px}
.flow .arrow{background:none;color:var(--muted);padding:0}
.result{font-family:var(--display);font-size:1.25rem;font-weight:800;padding:14px 16px;border-radius:14px;background:var(--E-soft)}
.result.neg{background:var(--bad-soft)}

.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px}
.cell{aspect-ratio:1/1;border:none;border-radius:20px;background:var(--surface);padding:12px;cursor:pointer;text-align:left;font-size:.88rem;line-height:1.3;display:flex;flex-direction:column;justify-content:space-between;border:2px solid var(--line);transition:transform .12s}
.cell:hover{transform:scale(1.02)}
.cell .n{font-family:var(--display);font-weight:800;color:var(--S);font-size:1.1rem}
.cell.done{background:var(--S);color:#fff;border-color:var(--S)}
.cell.done .n{color:#fff}
.cell.free{background:var(--S-soft)}
.cell.line{box-shadow:0 0 0 4px rgba(235,79,127,.35)}
@media (max-width:520px){.cell{font-size:.74rem;padding:8px;border-radius:14px}}
.task{background:var(--surface);border-radius:20px;padding:20px;margin-top:16px;max-width:760px;border-left:8px solid var(--S)}

.duel{background:var(--surface);border-radius:24px;padding:clamp(18px,4vw,30px);max-width:760px}
.duel .meta{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:1.1rem;margin-bottom:8px}
.tbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:18px}
.tbar i{display:block;height:100%;background:var(--K);transition:width .25s linear}
.stmt{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.25;min-height:3.6em}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tf .btn{padding:18px;font-size:1.15rem}
.tf .t{background:var(--ok);color:#fff}.tf .f{background:var(--bad);color:#fff}
.flash{min-height:2.6em;margin-top:12px;font-size:.93rem}
.streak{color:var(--K)}
.board{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;max-width:520px;counter-reset:r}
.board li{display:flex;justify-content:space-between;background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700}
.board li::before{counter-increment:r;content:counter(r) ".";color:var(--K);margin-right:10px;font-family:var(--display)}
.board li span:first-of-type{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{border:2px solid var(--line);border-radius:20px;padding:18px;background:var(--surface);text-align:left;cursor:pointer}
.mode:hover{border-color:var(--K)}
.mode b{font-family:var(--display);font-size:1.2rem;display:block}

.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.trophy{background:var(--surface);border-radius:20px;padding:16px;text-align:center;border:2px solid var(--line)}
.trophy .e{font-size:2.4rem;filter:grayscale(1);opacity:.35}
.trophy.got .e{filter:none;opacity:1}
.trophy.got{border-color:var(--accent)}
.trophy b{display:block;font-family:var(--display);margin-top:4px}
.trophy small{color:var(--muted);display:block;line-height:1.35;margin-top:4px}

.quad{max-width:520px;background:var(--surface);border-radius:24px;padding:12px}
.quad svg{width:100%;height:auto;display:block}
.card{background:var(--surface);border-radius:20px;padding:20px 22px;margin:12px 0;max-width:860px}
.card h4{font-family:var(--display);margin:0 0 6px;font-size:1.15rem}
.card ul{margin:6px 0 0;padding-left:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:860px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.grid2 .card{margin:0}
.sched{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.sched li{display:grid;grid-template-columns:90px 1fr;gap:12px}
.sched b{font-family:var(--display);color:var(--accent-ink)}
.learned{list-style:none;padding:0;display:grid;gap:8px;max-width:860px}
.learned li{background:var(--surface);border-radius:14px;padding:12px 16px;border-left:6px solid var(--accent)}
.summary{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
.summary div{background:var(--surface);border-radius:18px;padding:14px 18px;min-width:140px}
.summary strong{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;max-width:92vw;animation:up .3s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.foot{max-width:1120px;margin:0 auto;padding:0 clamp(14px,3vw,32px) 40px;color:var(--muted);font-size:.85rem}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

/* ===================== XP, LEVEL, BADGES ===================== */
const levelOf = xp => { let L = LEVELS[0]; for(const l of LEVELS) if(xp >= l[0]) L = l; return L; };
function drawXP(){
  const L = levelOf(S.xp), i = LEVELS.indexOf(L), next = LEVELS[i+1];
  $("#lvName").textContent = `${L[2]} ${L[1]}`;
  $("#xpNum").textContent = `${S.xp} XP`;
  $("#xpBar").style.width = next ? ((S.xp - L[0]) / (next[0] - L[0]) * 100) + "%" : "100%";
}
function addXP(n, why){
  if(n <= 0) return;
  const before = levelOf(S.xp);
  S.xp += n; save(); drawXP();
  const after = levelOf(S.xp);
  if(after !== before){ toast(`${after[2]} Level-Up! Du bist jetzt ${after[1]}.`); confetti(); }
  else if(why) toast(`+${n} XP · ${why}`);
}
function badge(id){
  if(S.badges.includes(id)) return;
  S.badges.push(id); save();
  const b = BADGES.find(x=>x.id===id);
  setTimeout(()=>{ toast(`${b.e} Neues Abzeichen: ${b.n}`); confetti(); }, 900);
}
let toastT;
function toast(m){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
function confetti(){
  const cols = ["#FF9B0F","#2F80ED","#EB4F7F","#7B5CFA","#1E8A55"];
  for(let i=0;i<36;i++){ const c=document.createElement("div"); c.className="confetti"; c.style.left=Math.random()*100+"vw"; c.style.background=cols[i%5]; c.style.animationDuration=(1.6+Math.random()*1.4)+"s"; c.style.animationDelay=(Math.random()*.3)+"s"; document.body.appendChild(c); setTimeout(()=>c.remove(),3400); }
}

    app.innerHTML = `<p class="kicker">Spielertyp-Check · Frage ${i+1} von ${TEST.length}</p>

function quizrun(l){
  const Q = QUIZ[l]; let i = 0, right = 0;
  const step = () => {
    if(i === Q.qs.length){
      S.quizBest[l] = Math.max(S.quizBest[l]||0, right);
      const passed = right >= 3;
      if(passed){ badge(l); addXP(20, `Level ${Q.name} bestanden`); }
      if(right === 4) badge("perfekt");
      save();
      app.innerHTML = `<p class="kicker">♦ Level ${Q.name}</p><div class="qcard"><p class="qtext">${passed ? `${Q.medal} Bestanden! ${right} von 4 richtig.` : `${right} von 4. Knapp daneben!`}</p>
        <p>${passed ? (l==="gold" ? "Du hast alle drei Medaillen. Respekt, das ist Profi-Niveau für den ersten Tag." : "Das nächste Level ist freigeschaltet.") : "Für die Medaille brauchst du drei richtige Antworten. Lies dir die Erklärungen nochmal durch und versuch's erneut."}</p>
        <div class="actions"><button class="btn" id="b1">${passed && l!=="gold" ? "Nächstes Level" : passed ? "Zurück zur Lizenz" : "Nochmal versuchen"}</button><button class="btn ghost" id="b2">Zu den Missionen</button></div></div>`;
      $("#b1").onclick = () => { if(passed && l!=="gold") go("quizrun", QUIZ_ORDER[QUIZ_ORDER.indexOf(l)+1]); else if(passed) go("quiz"); else go("quizrun", l); };
      $("#b2").onclick = () => go("hub");
      return;
    }
    const q = Q.qs[i];
    app.innerHTML = `<p class="kicker">♦ Level ${Q.name} · Frage ${i+1} von 4</p>
      <div class="qcard"><div class="dots">${Q.qs.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div><p class="qtext">${q.q}</p>
      <div class="choices">${q.o.map((o,k)=>`<button class="choice" data-k="${k}"><span>${esc(o)}</span></button>`).join("")}</div>
      <div class="explain" id="ex"></div><div class="actions" id="nx"></div></div>`;
    document.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.a;
      document.querySelectorAll(".choice").forEach((x,j)=>{ x.disabled = true; if(j===q.a) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      const qid = l + i;
      if(ok){ right++; if(!S.quizRight.includes(qid)){ S.quizRight.push(qid); addXP(10, "Richtig!"); } }
      $("#ex").className = "explain show"; $("#ex").innerHTML = `<b>${ok?"✅ Richtig!":"💡 Nicht ganz."}</b> ${q.w}`;
      $("#nx").innerHTML = `<button class="btn" id="n">${i<3?"Nächste Frage":"Auswertung"}</button>`;
      $("#n").onclick = () => { i++; step(); };
    });
  };
  step();
}

let blitzTimer = null;
function blitz(players, results){
  const who = players[results.length];
  app.innerHTML = `<p class="kicker">♣ ${players.length>1?`Duell · Runde ${results.length+1} von 2`:"Solo-Blitz"}</p><h2>${esc(who)}, bereit?</h2>
    <p class="lead">${players.length>1 && results.length===1 ? `${esc(players[0])} hat vorgelegt. Jetzt bist du dran, ${esc(who)}. Kein Spicken!` : "60 Sekunden laufen ab dem Start."}</p>
    <div class="actions"><button class="btn" id="go" style="background:var(--K);color:#fff">Start!</button></div>`;
  $("#go").onclick = () => {
    const pool = shuffle(DUEL.slice()); let idx = 0, pts = 0, right = 0, streak = 0, left = 60, lastMsg = "";
    const draw = () => {
      const it = pool[idx % pool.length];
      app.innerHTML = `<div class="duel"><div class="meta"><span>${esc(who)} · ${pts} Pkt.</span><span id="t">${left}s</span></div>
        <div class="tbar"><i id="tb" style="width:${left/60*100}%"></i></div>
        <div class="stmt">${esc(it[0])}</div>
        <div class="tf"><button class="btn t" data-v="1">Wahr</button><button class="btn f" data-v="0">Falsch</button></div>
        <div class="flash">${lastMsg}${streak>=3?` <span class="streak">🔥 Serie ×${streak}</span>`:""}</div></div>`;
      document.querySelectorAll(".tf .btn").forEach(b => b.onclick = () => {
        const ok = +b.dataset.v === it[1];
        if(ok){ right++; streak++; pts += 10 + (streak>=3?5:0); lastMsg = "✅ " + it[2]; }
        else { streak = 0; lastMsg = "❌ " + it[2]; }
        idx++; draw();
      });
    };
    clearInterval(blitzTimer);
    blitzTimer = setInterval(() => {
      left--; if($("#t")) $("#t").textContent = left + "s"; if($("#tb")) $("#tb").style.width = (left/60*100) + "%";
      if(left <= 0){
        clearInterval(blitzTimer);
        S.scores.push({n:who, s:pts}); save();
        const gain = Math.max(0, Math.min(right*4, 120 - S.blitzXp)); S.blitzXp += gain; save();
        if(results.length === 0){ addXP(gain, "Blitzrunde"); if(pts >= 100) badge("blitz"); }
        const res = results.concat([{n:who, s:pts, r:right}]);
        if(res.length < players.length) return blitz(players, res);
        finishDuel(res);
      }
    }, 1000);
    draw();
  };
}
function finishDuel(res){
  let head, text;
  if(res.length === 1){ head = `${res[0].s} Punkte!`; text = `${res[0].r} richtige Antworten in 60 Sekunden.${res[0].s>=100?" Das ist Blitzmerker-Niveau.":" Da geht noch mehr, versuch's gleich nochmal."}`; }
  else {
    badge("duell");
    const [a,b] = res;
    head = a.s === b.s ? "Unentschieden! 🤝" : `${esc((a.s>b.s?a:b).n)} gewinnt! 🏆`;
    text = `${esc(a.n)}: ${a.s} Punkte · ${esc(b.n)}: ${b.s} Punkte. Revanche gefällig?`;
  }
  confetti();
  app.innerHTML = `<p class="kicker">♣ Ergebnis</p><div class="duel"><p class="stmt" style="min-height:0">${head}</p><p>${text}</p>
    <div class="actions"><button class="btn" id="again" style="background:var(--K);color:#fff">Nochmal</button><button class="btn ghost" id="list">Zur Bestenliste</button></div></div>`;
  $("#again").onclick = () => blitz(res.map(r=>r.n), []);
  $("#list").onclick = () => go("duel");
}
