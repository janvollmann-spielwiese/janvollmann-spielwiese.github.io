<style>
:root{--bg:#F4EFE6;--surface:#FFFFFF;--ink:#2B2420;--muted:#6E625A;--line:#E3D8CB;--accent:#C2621F;--accent-ink:#9A4A12;--soft:#FBE7D3;
  --good:#3FA34D;--mid:#E39B2D;--low:#D64535;
  --display:"Outfit","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Nunito Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1916;--surface:#29231F;--ink:#F4ECE4;--muted:#BCAEA3;--line:#433A33;--accent-ink:#F2A26A;--soft:#3E2A1C;--good:#5CC46A;--mid:#F0B04A;--low:#FF7A6B}}
:root[data-theme="dark"]{--bg:#1D1916;--surface:#29231F;--ink:#F4ECE4;--muted:#BCAEA3;--line:#433A33;--accent-ink:#F2A26A;--soft:#3E2A1C;--good:#5CC46A;--mid:#F0B04A;--low:#FF7A6B}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px}
.top a{font-family:var(--display);font-weight:700;text-decoration:none;color:var(--muted)}
.top a:hover{color:var(--accent-ink)}
@media (max-width:480px){.top .t{display:none}.top a{font-size:1.4rem}}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,4vw,1.6rem);margin:0;text-align:center}
.ibtn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{border-color:var(--accent)}
.card{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:clamp(10px,2.5vw,20px);position:relative}
.btn{font:inherit;font-family:var(--display);font-weight:800;border:0;border-radius:16px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 5px 0 #8A410F;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8A410F}

/* Bedürfnisse */
.hud{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 12px;margin:0 0 10px}
@media (max-width:600px){.hud{grid-template-columns:repeat(3,minmax(0,1fr))}}
.need{display:flex;align-items:center;gap:6px;min-width:0}
.need .ic{font-size:1.25rem;line-height:1;flex:none}
.need .bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden;min-width:0}
.need .bar i{display:block;height:100%;width:50%;border-radius:99px;background:var(--good);transition:width .3s,background-color .3s}
.need.mid .bar i{background:var(--mid)}
.need.low .bar i{background:var(--low)}
.need.low .ic{animation:wob 1s ease-in-out infinite}
@keyframes wob{50%{transform:scale(1.25)}}

/* Sprechblase */
.say{position:relative;background:var(--soft);color:var(--ink);border-radius:16px;padding:8px 14px;margin:0 0 14px;font-family:var(--display);font-weight:700;font-size:clamp(1rem,3vw,1.2rem);line-height:1.3;min-height:2.9em;display:flex;align-items:center;gap:10px}
.say::after{content:"";position:absolute;left:40%;bottom:-10px;border:10px solid transparent;border-bottom:0;border-top-color:var(--soft)}
.say .who{font-size:1.5rem;line-height:1;flex:none}
.say.task{background:#E3F1DF;color:#1F3D22}
.say.task::after{border-top-color:#E3F1DF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .say.task{background:#22382A;color:#DDF2DF}:root:not([data-theme="light"]) .say.task::after{border-top-color:#22382A}}
:root[data-theme="dark"] .say.task{background:#22382A;color:#DDF2DF}
:root[data-theme="dark"] .say.task::after{border-top-color:#22382A}

.scene{display:block;width:100%;height:auto;aspect-ratio:960/600;border-radius:14px;background:#EAD3B2;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}

/* Aktionen */
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.act{position:relative;font:inherit;font-family:var(--display);font-weight:800;font-size:clamp(.72rem,2.3vw,.95rem);border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--accent-ink);box-shadow:0 4px 0 var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;min-height:74px;transition:transform .08s}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.act:hover{border-color:var(--accent)}
.act .e{font-size:clamp(1.5rem,5.5vw,2rem);line-height:1.1}
.act.alert::after{content:"!";position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:#D64535;color:#fff;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 0 3px var(--surface);animation:wob 1.2s ease-in-out infinite}
.taskbar{display:flex;justify-content:center;margin-top:14px}
.taskbar .btn{padding:12px 24px;font-size:1.1rem}

/* Anziehen */
.dress{margin-top:12px}
.dl{margin:6px 0 6px;font-family:var(--display);font-weight:800;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-weight:800;font-size:.95rem;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:48px}
.opt .dot{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

.rank{text-align:center;color:var(--muted);font-weight:800;margin:14px 0 0;font-size:.95rem}
.reset{display:block;margin:8px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer}
[hidden]{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:28px 16px calc(24px + env(safe-area-inset-bottom,0px))}
footer a{color:var(--muted);font-weight:700;text-decoration:none;margin:0 8px}
@media (prefers-reduced-motion:reduce){.btn,.act{transition:none}.need.low .ic,.act.alert::after{animation:none}}
</style>
</head>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var cv=$('scene'),ctx=cv.getContext('2d'),W=960,H=600,FLOOR=520;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function star(x,y,r){ctx.beginPath();for(var i=0;i<10;i++){var a=i*Math.PI/5-Math.PI/2,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();ctx.fill();}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.2,y+s*.2,x-s*.6,y-s*.7,x,y-s*.15);ctx.bezierCurveTo(x+s*.6,y-s*.7,x+s*1.2,y+s*.2,x,y+s*.9);ctx.closePath();ctx.fill();}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function hash(i){var s=Math.sin(i*12.9898+4.1)*43758.5453;return s-Math.floor(s);}
/* Koda-Zeichnung wie in den anderen Koda-Spielen, erweitert um Halsband, Augen und Kleidung */
var FUR='#C0652A',FUR_L='#D27E3F',FUR_D='#9A4D1C',EAR='#8E451A',NOSE='#4A2C22',COLLAR='#4E3424';
function frontLeg(px,py,ang,col){
  // Vorderlauf: Oberarm, gerader Unterarm, Pfote
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(-8,-6);ctx.quadraticCurveTo(-9,14,-5,24);ctx.lineTo(5,24);ctx.quadraticCurveTo(9,10,8,-6);ctx.closePath();ctx.fill();
  ctx.translate(0,22);ctx.rotate(-ang*.6);
  rr(-5,0,10,22,5);ctx.fill();
  ell(3,22,8,4.5);ctx.fill();
  ctx.restore();
}
function hindLeg(px,py,ang,col){
  // Hinterlauf: kräftiger Oberschenkel, schräger Unterschenkel, Sprunggelenk, Pfote
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(-14,-10);ctx.quadraticCurveTo(-18,12,-4,22);ctx.lineTo(8,18);ctx.quadraticCurveTo(14,0,12,-10);ctx.closePath();ctx.fill();
  ctx.translate(2,18);ctx.rotate(.55-ang*.4);
  rr(-5,0,10,20,5);ctx.fill();
  ctx.translate(0,18);ctx.rotate(-.55);
  rr(-4.5,0,9,14,4.5);ctx.fill();
  ell(4,14,8,4.5);ctx.fill();
  ctx.restore();
}
function drawKoda(x,y,run,air,state){
  // x = Mitte, y = Pfoten-Grundlinie, Blick nach rechts
  var s=run,sw=air?0:Math.sin(s),sw2=air?0:Math.sin(s+Math.PI);
  var bob=air?0:-Math.abs(Math.sin(s))*3;
  ctx.save();ctx.translate(x,y+bob);
  if(state.stumble>0)ctx.rotate(-.16*Math.sin(state.stumble*12));
  if(state.blink)ctx.globalAlpha=.55;
  // Schatten
  ctx.save();ctx.translate(0,-bob-(air?state.y:0));ctx.fillStyle='rgba(0,0,0,'+(air?.1:.18)+')';ell(4,2,50,6);ctx.fill();ctx.restore();
  // Rute (dicke Otterrute)
  var wag=Math.sin(state.wag)*.3;
  ctx.save();ctx.translate(-52,-62);ctx.rotate(-.35+wag);
  ctx.fillStyle=FUR;ctx.beginPath();ctx.moveTo(4,-7);ctx.quadraticCurveTo(-22,-12,-42,0);ctx.quadraticCurveTo(-22,2,4,8);ctx.closePath();ctx.fill();
  ctx.restore();
  // ferne Läufe
  hindLeg(-36,-50,air?-.6:sw2*.5,FUR_D);
  frontLeg(36,-50,air?.9:sw*.55,FUR_D);
  // Körper als eine Form: Rücken, Hals, Brust, Bauch, Keule
  ctx.fillStyle=FUR;ctx.beginPath();
  ctx.moveTo(-54,-60);
  ctx.bezierCurveTo(-30,-76,6,-72,30,-76);
  var hd=state.head||0,PX=48,PY=-62;
  function rp(x,y){var dx=x-PX,dy=y-PY,c=Math.cos(hd),s=Math.sin(hd);return [PX+dx*c-dy*s,PY+dx*s+dy*c];}
  var n1=rp(38,-90),n2=rp(46,-106),n3=rp(70,-94),n4=rp(68,-70);
  ctx.quadraticCurveTo(n1[0],n1[1],n2[0],n2[1]);
  ctx.lineTo(n3[0],n3[1]);
  ctx.quadraticCurveTo(n4[0],n4[1],56,-58);
  ctx.quadraticCurveTo(50,-38,32,-36);
  ctx.bezierCurveTo(12,-38,-10,-46,-26,-44);
  ctx.quadraticCurveTo(-46,-34,-58,-46);
  ctx.quadraticCurveTo(-62,-54,-54,-60);
  ctx.closePath();ctx.fill();
  // Licht auf dem Rücken, Schatten am Bauch
  ctx.fillStyle=FUR_L;ctx.beginPath();ctx.moveTo(-46,-64);ctx.bezierCurveTo(-24,-75,6,-71,28,-74);ctx.quadraticCurveTo(4,-66,-46,-60);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(120,50,15,.18)';ell(-2,-44,30,5,-.05);ctx.fill();
  // heller Brustfleck
  ctx.fillStyle='#E9A877';ell(53,-47,3,5,-.4);ctx.fill();
  // nahe Läufe
  hindLeg(-42,-50,air?-.8:sw*.55,FUR);
  frontLeg(30,-48,air?1.05:sw2*.6,FUR);
  // Matsch, Fellbüschel, Kleidung, Zecke
  if(state.over)state.over();
  // Kopf, Halsband und Ohr drehen sich beim Fressen mit
  ctx.save();ctx.translate(PX,PY);ctx.rotate(hd);ctx.translate(-PX,-PY);
  // Halsband
  ctx.strokeStyle=state.collar||COLLAR;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(46,-96);ctx.quadraticCurveTo(56,-86,62,-78);ctx.stroke();
  ctx.fillStyle='#C9A24A';if(state.bell){ell(59,-78,5.5,5.5);ctx.fill();ctx.fillStyle='#7A5A10';ell(59,-75,1.6,1.6);ctx.fill();}else{ell(58,-82,3,3);ctx.fill();}
  // Kopf: breiter Schädel, deutlicher Stopp, Schnauze
  ctx.fillStyle=FUR;
  ctx.beginPath();ctx.moveTo(48,-104);
  ctx.quadraticCurveTo(52,-124,70,-122);
  ctx.quadraticCurveTo(80,-121,82,-114);
  ctx.quadraticCurveTo(96,-114,100,-106);
  ctx.quadraticCurveTo(102,-96,94,-94);
  ctx.quadraticCurveTo(84,-90,72,-92);
  ctx.quadraticCurveTo(62,-88,56,-94);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=FUR_L;ell(66,-116,11,4,-.2);ctx.fill();
  // Nase
  ctx.fillStyle=NOSE;ell(99,-107,5,4.2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ell(98,-108.5,1.6,1);ctx.fill();
  // Maul, Zunge oder Ball
  ctx.strokeStyle=NOSE;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(97,-98);ctx.quadraticCurveTo(86,-93,76,-95);ctx.stroke();
  if(state.ball){ctx.fillStyle='#D7F25A';ell(95,-94,8,8);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(88,-94,7,-.8,.8);ctx.stroke();}
  else if(!(state.stumble>0)&&!state.eyes){ctx.fillStyle='#E46A7A';rr(81,-96,9,14+Math.sin(s*2)*2,5);ctx.fill();ctx.strokeStyle='#C24E60';ctx.beginPath();ctx.moveTo(85.5,-94);ctx.lineTo(85.5,-85);ctx.stroke();}
  // Auge mit Braue
  if(state.stumble>0){ctx.strokeStyle='#2A1A12';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(72,-114);ctx.lineTo(78,-109);ctx.moveTo(78,-114);ctx.lineTo(72,-109);ctx.stroke();}
  else if(state.eyes==='zu'){ctx.strokeStyle='#3A2216';ctx.lineWidth=2;ctx.beginPath();ctx.arc(75,-113,4,.25,Math.PI-.25);ctx.stroke();}
  else{ctx.fillStyle='#3A2216';ell(75,-112,3.4,3.6);ctx.fill();ctx.fillStyle='#fff';ell(76,-113.3,1.2,1.2);ctx.fill();
    if(state.eyes==='krank'){ctx.fillStyle=FUR_D;ctx.beginPath();ctx.ellipse(75,-112,4.6,4.6,0,Math.PI,0);ctx.fill();}
    ctx.strokeStyle=FUR_D;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(70,-118);ctx.quadraticCurveTo(75,-120,80,-117);ctx.stroke();}
  // Schlappohr, etwas dunkler
  var flap=(air?-.45:Math.sin(s*2)*.12)+(state.droop||0);
  ctx.save();ctx.translate(60,-118);ctx.rotate(.1+flap);
  ctx.fillStyle=EAR;ctx.beginPath();ctx.moveTo(-6,0);ctx.quadraticCurveTo(-16,12,-12,28);ctx.quadraticCurveTo(-5,35,4,27);ctx.quadraticCurveTo(9,10,7,0);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.restore();
  // Schwindelsterne
  if(state.stumble>0){for(var k=0;k<3;k++){var a=state.wag*2+k*2.1;ctx.fillStyle='#FFD54A';star(70+Math.cos(a)*22,-136+Math.sin(a)*6,6);}}
  ctx.restore();
}


/* ---------- Koda mit Kleidung, Matsch, Zecke und Fellbüscheln ---------- */
var DRY=['#C0652A','#D27E3F','#9A4D1C','#8E451A'],WET=['#8E4A1F','#A35A28','#6E3814','#62300F'];
var COLLARS={braun:['Braun','#4E3424'],rot:['Rot','#C62828'],blau:['Blau','#1E63B5'],pink:['Pink','#E0559A'],gruen:['Grün','#2E8B57']};
var TOPS={none:['Nichts','transparent'],warn:['Warnweste','#D9F02B'],strick:['Strickweste','#C62828'],regen:['Regenjacke','#F2C230'],winter:['Winterjacke','#2F6B4F'],glitzer:['Glitzerjacke','#D85AA8']};
var MUD=[[-40,-8,7,4],[34,-8,7,4],[-46,-22,5,6],[30,-24,4,6],[-14,-42,9,4],[12,-40,7,3],[-30,-44,5,3],[48,-44,3,4],[-36,-30,3,3],[24,-16,3,3]];
function topPath(kind){

  var s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}

  if(!COLLARS[s.outfit.collar])s.outfit.collar='braun';if(!TOPS[s.outfit.top])s.outfit.top='none';

    var self=this;[this.pill,this.treat].forEach(function(o){if(!(drag&&drag.o===o)){o.x+=(o.hx-o.x)*Math.min(1,dt*6);o.y+=(o.hy-o.y)*Math.min(1,dt*6);}});

    if(this.ph==='eat'){this.t-=dt;this.head=Math.sin(this.t*20)*.08+.15;if(this.t<=0){this.ph='end';this.head=0;S.sick=false;add('health',30);burst('heart',this.mouth().x,this.mouth().y-60,8,160);finish('Gut gemacht! Koda wird ganz schnell wieder gesund.',2);}}
  },
  draw:function(){
    wall('#EAF4EF','#D8E9E0');
    ctx.fillStyle='#FFFFFF';rr(80,60,180,120,10);ctx.fill();ctx.fillStyle='#E25B4C';ctx.fillRect(155,80,30,80);ctx.fillRect(130,105,80,30);
    ctx.fillStyle='#B98552';ctx.fillRect(0,FLOOR-14,W,14);floorWood(FLOOR,'#D7B48A','#B98E60');
    ctx.fillStyle='#8B5A2B';ctx.fillRect(620,430,14,90);ctx.fillRect(900,430,14,90);ctx.fillStyle='#A86A35';rr(600,410,330,24,8);ctx.fill();
    ctx.fillStyle='#F4A340';rr(880,340,40,70,8);ctx.fill();ctx.fillStyle='#fff';rr(874,326,52,18,5);ctx.fill();ctx.fillStyle='#E25B4C';ctx.fillRect(895,360,10,30);ctx.fillRect(885,370,30,10);
    var rot=this.shake>0?Math.sin(this.shake*40)*.06:0;
    koda(250,FLOOR,1.8,{head:this.head,rot:rot,eyes:this.ph==='end'?'':undefined,healthy:this.ph==='end'});
    var t=this.treat;
    if(this.ph!=='eat'&&this.ph!=='end'){ctx.fillStyle='#C98A7A';ell(t.x,t.y-6,42,28);ctx.fill();ctx.fillStyle='#E0A898';ell(t.x-12,t.y-16,16,8);ctx.fill();ctx.fillStyle='#A86A5C';[[-16,0],[8,6],[20,-10],[-2,-4]].forEach(function(d){ell(t.x+d[0],t.y+d[1]-6,4,3);ctx.fill();});
      ctx.fillStyle='#6E3A2E';ctx.font='800 18px Outfit, sans-serif';ctx.textAlign='center';ctx.fillText('Leberwurst',t.x,t.y-46);}
    var p=this.pill;
    if(!p.hid){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.4);ctx.scale(1.6,1.6);ctx.fillStyle='#FFFFFF';rr(-18,-8,36,16,8);ctx.fill();ctx.fillStyle='#4FB3D9';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(10,-8);ctx.arcTo(18,-8,18,0,8);ctx.arcTo(18,8,10,8,8);ctx.lineTo(0,8);ctx.closePath();ctx.fill();ctx.restore();}
  },
  down:function(p){
    if(this.ph==='hide'&&dist(p,this.pill)<45)drag={o:this.pill,dx:p.x-this.pill.x,dy:p.y-this.pill.y};
    else if(this.ph==='give'&&dist(p,this.treat)<55)drag={o:this.treat,dx:p.x-this.treat.x,dy:p.y-this.treat.y};
    else if(this.ph==='hide'&&dist(p,this.treat)<55)sayTask('Erst die Tablette in die Leberwurst stecken!');
  },
  move:function(p){if(drag){drag.o.x=p.x-drag.dx;drag.o.y=p.y-drag.dy;}},
  up:function(){
    if(!drag)return;var o=drag.o;drag=null;var m=this.mouth();
    if(o===this.pill){
      if(dist(o,this.treat)<60){o.hid=true;this.ph='give';sfx.ok();sayTask('Versteckt! Jetzt gib Koda die Leberwurst – zieh sie zu seinem Maul.');}
      else if(dist(o,m)<90){this.shake=.6;sfx.no();sayKoda('Pfui! Die Tablette schmeckt bitter. Die spuck ich aus!',3);}
    }else if(dist(o,m)<95){this.ph='eat';this.t=1.2;sfx.crunch();sayKoda('Mmmh, Leberwurst! Da ist doch nichts drin, oder?',3);}
  }
};

/* Zecke entfernen */
var TX=480,TY=300;
SC.tick={
  enter:function(){this.ph='grab';this.turn=0;this.lastA=null;this.tool={x:800,y:500};this.tk={x:TX,y:TY,r:0};this.pad={x:820,y:470,hx:820,hy:470};this.t=0;
    var f=[];for(var i=0;i<320;i++)f.push([hash(i)*W,hash(i+500)*H,.3+hash(i+900)*.5,14+hash(i+1300)*18,hash(i+1700)]);this.fur=f;
    sayTask('Da ist die Zecke! Nimm die Zeckenzange und fass sie damit an.');},
  update:function(dt){
    if(this.ph==='grab'&&!drag){this.tool.x+=(800-this.tool.x)*Math.min(1,dt*6);this.tool.y+=(500-this.tool.y)*Math.min(1,dt*6);}
    if(this.ph==='pull'){this.t+=dt;var u=Math.min(1,this.t/1.3);
      if(u<.45){this.tk.y=TY-(u/.45)*120;}else{var v=(u-.45)/.55;this.tk.x=TX+(150-TX)*v;this.tk.y=TY-120+(440-(TY-120))*v;}
      this.tool.x=this.tk.x;this.tool.y=this.tk.y;
      if(u>=1){this.ph='clean';this.inJar=true;sfx.ok();sayTask('Geschafft! Jetzt tupf die Stelle mit dem Desinfektionstupfer ab.');}}
    if(this.ph==='clean'&&!(drag&&drag.obj==='pad')){this.pad.x+=(this.pad.hx-this.pad.x)*Math.min(1,dt*6);this.pad.y+=(this.pad.hy-this.pad.y)*Math.min(1,dt*6);}
  },
  draw:function(){
    ctx.fillStyle=DRY[0];ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(TX,TY,40,TX,TY,620);g.addColorStop(0,'rgba(255,220,180,.18)');g.addColorStop(1,'rgba(60,20,0,.3)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.lineCap='round';ctx.lineWidth=3;
    this.fur.forEach(function(f){ctx.strokeStyle=f[4]<.5?DRY[1]:DRY[2];ctx.beginPath();ctx.moveTo(f[0],f[1]);ctx.lineTo(f[0]+Math.cos(f[2])*f[3],f[1]+Math.sin(f[2])*f[3]);ctx.stroke();});
    ctx.strokeStyle=COLLARS[S.outfit.collar][1];ctx.lineWidth=46;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(-20,90);ctx.quadraticCurveTo(300,40,560,-30);ctx.stroke();
    // Bissstelle: gescheiteltes Fell mit heller Haut, nach dem Entfernen gut sichtbar
    if(this.ph==='clean'||this.ph==='done'){
      ctx.fillStyle=DRY[2];ell(TX,TY,52,38);ctx.fill();
      ctx.fillStyle='#F3C9B4';ell(TX,TY,40,28);ctx.fill();
      ctx.fillStyle=this.cleaned?'rgba(240,150,150,.35)':'rgba(230,90,90,.55)';ell(TX,TY,20,15);ctx.fill();
      if(!this.cleaned){ctx.fillStyle='#B3261E';ell(TX,TY,5,5);ctx.fill();
        var pr=1+Math.sin(performance.now()/180)*.08;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=4;ctx.setLineDash([10,8]);ell(TX,TY,62*pr,48*pr);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#FFFFFF';ctx.font='800 26px Outfit, sans-serif';ctx.textAlign='center';ctx.fillText('hier abtupfen',TX,TY-66);}
    }
    // Glas
    ctx.fillStyle='rgba(220,240,255,.55)';rr(100,380,100,120,14);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#9BA7B0';rr(94,368,112,18,6);ctx.fill();
    if(this.inJar)drawTick(150,465,1.6,1.2);
    if(this.ph==='turn'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=8;ctx.beginPath();ctx.arc(TX,TY,95,0,Math.PI*2);ctx.stroke();
      var pr=Math.min(1,Math.abs(this.turn)/(Math.PI*4));ctx.strokeStyle='#3FA34D';ctx.beginPath();ctx.arc(TX,TY,95,-Math.PI/2,-Math.PI/2+pr*Math.PI*2);ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='800 24px Outfit, sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(pr*100)+' %',TX,TY+140);}
    if(!this.inJar)drawTick(this.tk.x,this.tk.y,2.4,this.tk.r);
    if(this.ph!=='clean'&&this.ph!=='done')drawTweezers(this.tool.x,this.tool.y+(this.ph==='grab'?0:4),this.ph==='turn'?this.turn*.5:.5);
    if(this.ph==='clean'||this.ph==='done'){var p=this.pad;ctx.fillStyle='rgba(0,0,0,.18)';ell(p.x+3,p.y+5,40,33);ctx.fill();ctx.fillStyle='#FFFFFF';ell(p.x,p.y,40,33);ctx.fill();ctx.fillStyle='rgba(120,190,230,.5)';ell(p.x,p.y,22,16);ctx.fill();}
  },
  down:function(p){
    if(this.ph==='grab'&&Math.hypot(p.x-this.tool.x,p.y-this.tool.y+50)<90)drag={obj:'tw',dx:p.x-this.tool.x,dy:p.y-this.tool.y};
    else if(this.ph==='turn'){drag={obj:'turn'};this.lastA=Math.atan2(p.y-TY,p.x-TX);}
    else if(this.ph==='clean'&&dist(p,this.pad)<60)drag={obj:'pad',dx:p.x-this.pad.x,dy:p.y-this.pad.y};
  },
  move:function(p){
    if(!drag)return;
    if(drag.obj==='tw'){this.tool.x=p.x-drag.dx;this.tool.y=p.y-drag.dy;
      if(Math.hypot(this.tool.x-TX,this.tool.y-TY)<36){this.tool.x=TX;this.tool.y=TY;this.ph='turn';drag={obj:'turn'};this.lastA=Math.atan2(p.y-TY,p.x-TX);sfx.pop();
        sayTask('Gepackt! Jetzt dreh die Zange langsam im Kreis – fahr mit dem Finger rund um die Zecke.');}}
    else if(drag.obj==='turn'){if(Math.hypot(p.x-TX,p.y-TY)<25)return;var a=Math.atan2(p.y-TY,p.x-TX),d=a-this.lastA;
      if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;this.lastA=a;this.turn+=d;this.tk.r=this.turn;
      if(Math.abs(this.turn)>=Math.PI*4){this.ph='pull';drag=null;this.t=0;sfx.ok();sayTask('Und raus damit – ab ins Glas!');}}
    else if(drag.obj==='pad'){this.pad.x=p.x-drag.dx;this.pad.y=p.y-drag.dy;
      if(Math.hypot(this.pad.x-TX,this.pad.y-TY)<45&&!this.cleaned){this.cleaned=true;drag=null;this.ph='done';this.pad.hx=TX;this.pad.hy=TY;burst('star',TX,TY,10,200);
        S.tick=false;add('health',15);finish('Zecke ist raus! Koda sagt Danke und schleckt dir die Hand ab.',3);}}
  },
  up:function(){if(drag&&drag.obj==='tw')sayTask('Fass die Zecke mit der Spitze der Zange an!');drag=null;}
};

/* ---------- Ablauf ---------- */
var CHECK={
  feed:function(){return S.hunger>90&&'Ich bin pappsatt! Später gerne wieder.';},
  sleep:function(){return S.energy>85&&'Ich bin noch gar nicht müde!';},
  med:function(){return !S.sick&&'Ich bin gesund – Medizin brauche ich nicht.';},
  tick:function(){return !S.tick&&'Keine Zecke weit und breit. Prima!';},
  claws:function(){return S.claws<25&&'Meine Krallen sind noch schön kurz.';},
  ball:function(){return S.energy<10&&'Ich bin zu müde zum Spielen … erst schlafen!';},
  gassi:function(){return S.energy<8&&'Ich bin zu müde für einen Spaziergang.';}
};
var mode='home',sc=SC.home;
function go(name){
  if(name!=='home'&&CHECK[name]){var m=CHECK[name]();if(m){sayKoda(m,3);sfx.no();return;}}
  mode=name;sc=SC[name];drag=null;parts=[];doneT=0;sc.fin=false;sc.done=false;
  if(sc.enter)sc.enter();
  $('acts').hidden=name!=='home';$('task').hidden=name==='home';$('dressPanel').hidden=name!=='dress';
  $('homeBtn').textContent=name==='dress'?'🏠 Fertig':'🏠 Zurück nach Hause';
  save();hud();
}
function finish(text,n){
  if(sc.done)return;sc.done=true;addStars(n);sfx.win();
  for(var i=0;i<n+5;i++)addP('star',rnd(260,700),rnd(160,320),rnd(-80,80),rnd(-160,-60),1.4,{g:120,s:rnd(9,15)});
  sayTask(text+' +'+n+' ⭐');$('homeBtn').textContent='🏠 Weiter';doneT=3.2;save();
}
var ALERT={feed:function(){return S.hunger<35;},gassi:function(){return S.gassi<35;},ball:function(){return S.fun<35;},sleep:function(){return S.energy<30;},
  brush:function(){return S.clean<50&&!S.mud;},shower:function(){return S.mud||S.clean<30;},claws:function(){return S.claws>75;},med:function(){return S.sick;},tick:function(){return S.tick;}};
var needEls=[].slice.call(document.querySelectorAll('.need'));
var actEls=[].slice.call(document.querySelectorAll('.act'));
function hud(){
  needEls.forEach(function(el){var k=el.getAttribute('data-k'),v=Math.round(S[k]);el.querySelector('i').style.width=v+'%';el.className='need'+(v<30?' low':v<60?' mid':'');el.querySelector('.bar').setAttribute('aria-valuenow',v);});
  actEls.forEach(function(b){var f=ALERT[b.getAttribute('data-go')];b.classList.toggle('alert',!!(f&&f()));});
}
actEls.forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-go'));});});
$('homeBtn').addEventListener('click',function(){go('home');});
$('reset').addEventListener('click',function(){if(window.confirm('Wirklich neu anfangen? Kodas Pflegesterne und Kleidung werden zurückgesetzt.')){S=fresh();go('home');addStars(0);sayKoda('Hallo, ich bin Koda! Kümmerst du dich heute um mich?',4);}});

function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',function(e){e.preventDefault();var p=pos(e);ptr=p;ptrDown=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}if(sc.down)sc.down(p);});
cv.addEventListener('pointermove',function(e){var p=pos(e),mv=dist(p,ptr);ptr=p;if(ptrDown&&sc.move)sc.move(p,mv);});
function release(e){if(!ptrDown)return;ptrDown=false;var p=pos(e);if(sc.up)sc.up(p);else drag=null;}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

var last=0,hudT=0,saveT=5;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  sess+=dt;if(petCd>0)petCd-=dt;if(petT>0)petT-=dt;
  var mood=(S.hunger+S.gassi+S.fun+S.energy+S.clean+S.health)/600;wagP+=dt*(3+10*mood+(petT>0?8:0));
  sc.update(dt);updParts(dt);
  if(doneT>0){doneT-=dt;if(doneT<=0)go('home');}
  hudT-=dt;if(hudT<=0){hudT=.25;hud();}
  saveT-=dt;if(saveT<=0){saveT=5;save();}
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.clearRect(0,0,W,H);sc.draw();drawParts();
  requestAnimationFrame(loop);
}
function resize(){var r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.width*H/W*d);if(w>0&&(cv.width!==w||cv.height!==h)){cv.width=w;cv.height=h;}}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('pagehide',save);
resize();addStars(0);hud();
sayKoda(S.stars?'Da bist du ja wieder! Ich hab dich vermisst.':'Hallo, ich bin Koda! Kümmerst du dich heute um mich?',4);
requestAnimationFrame(loop);
})();
</script>
