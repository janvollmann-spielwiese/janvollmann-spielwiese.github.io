<style>
:root{--bg:#F4EFE6;--surface:#FFFFFF;--ink:#2B2420;--muted:#6E625A;--line:#E3D8CB;--accent:#C2621F;--accent-ink:#9A4A12;--soft:#FBE7D3;
  --good:#3FA34D;--mid:#E39B2D;--low:#D64535;
  --display:"Outfit","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Nunito Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1916;--surface:#29231F;--ink:#F4ECE4;--muted:#BCAEA3;--line:#433A33;--accent-ink:#F2A26A;--soft:#3E2A1C;--good:#5CC46A;--mid:#F0B04A;--low:#FF7A6B}}
:root[data-theme="dark"]{--bg:#1D1916;--surface:#29231F;--ink:#F4ECE4;--muted:#BCAEA3;--line:#433A33;--accent-ink:#F2A26A;--soft:#3E2A1C;--good:#5CC46A;--mid:#F0B04A;--low:#FF7A6B}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px}
.top a{font-family:var(--display);font-weight:700;text-decoration:none;color:var(--muted)}
.top a:hover{color:var(--accent-ink)}
@media (max-width:480px){.top .t{display:none}.top a{font-size:1.4rem}}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,4vw,1.6rem);margin:0;text-align:center}
.ibtn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{border-color:var(--accent)}
.card{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:clamp(10px,2.5vw,20px);position:relative}
.btn{font:inherit;font-family:var(--display);font-weight:800;border:0;border-radius:16px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 5px 0 #8A410F;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8A410F}

/* Bedürfnisse */
.hud{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 12px;margin:0 0 10px}
@media (max-width:600px){.hud{grid-template-columns:repeat(4,minmax(0,1fr))}}
.need{display:flex;align-items:center;gap:6px;min-width:0}
.need .ic{font-size:1.25rem;line-height:1;flex:none}
.need .bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden;min-width:0}
.need .bar i{display:block;height:100%;width:50%;border-radius:99px;background:var(--good);transition:width .3s,background-color .3s}
.need.mid .bar i{background:var(--mid)}
.need.low .bar i{background:var(--low)}
.need.low .ic{animation:wob 1s ease-in-out infinite}
@keyframes wob{50%{transform:scale(1.25)}}

/* Sprechblase */
.say{position:relative;background:var(--soft);color:var(--ink);border-radius:16px;padding:8px 14px;margin:0 0 14px;font-family:var(--display);font-weight:700;font-size:clamp(1rem,3vw,1.2rem);line-height:1.3;min-height:2.9em;display:flex;align-items:center;gap:10px}
.say::after{content:"";position:absolute;left:40%;bottom:-10px;border:10px solid transparent;border-bottom:0;border-top-color:var(--soft)}
.say .who{font-size:1.5rem;line-height:1;flex:none}
.say.task{background:#E3F1DF;color:#1F3D22}
.say.task::after{border-top-color:#E3F1DF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .say.task{background:#22382A;color:#DDF2DF}:root:not([data-theme="light"]) .say.task::after{border-top-color:#22382A}}
:root[data-theme="dark"] .say.task{background:#22382A;color:#DDF2DF}
:root[data-theme="dark"] .say.task::after{border-top-color:#22382A}

.scene{display:block;width:100%;height:auto;aspect-ratio:960/600;border-radius:14px;background:#EAD3B2;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}

/* Aktionen */
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:760px){.acts{grid-template-columns:repeat(7,minmax(0,1fr))}}
.act{position:relative;font:inherit;font-family:var(--display);font-weight:800;font-size:clamp(.72rem,2.3vw,.95rem);border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--accent-ink);box-shadow:0 4px 0 var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;min-height:74px;transition:transform .08s}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.act:hover{border-color:var(--accent)}
.act .e{font-size:clamp(1.5rem,5.5vw,2rem);line-height:1.1}
.act.alert::after{content:"!";position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:#D64535;color:#fff;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 0 3px var(--surface);animation:wob 1.2s ease-in-out infinite}
.stage{position:relative}
.wx{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.88);color:#2B2420;border-radius:999px;padding:2px 12px;font-family:var(--display);font-weight:800;font-size:clamp(.78rem,2.4vw,1rem);pointer-events:none}
.routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.act.route{font-size:clamp(.9rem,2.8vw,1.1rem);padding:12px 6px;min-height:110px}
.act.route small{font-family:var(--body);font-weight:700;font-size:clamp(.7rem,2.1vw,.85rem);color:var(--muted);line-height:1.25;text-align:center}
.taskbar{display:flex;justify-content:center;margin-top:14px}
.taskbar .btn{padding:12px 24px;font-size:1.1rem}

/* Anziehen */
.dress{margin-top:12px}
.dl{margin:6px 0 6px;font-family:var(--display);font-weight:800;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-weight:800;font-size:.95rem;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:48px}
.opt .dot{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

.tasks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:12px 0 0}
.tasks .th{font-family:var(--display);font-weight:800;color:var(--muted);font-size:.92rem}
.chip{background:var(--soft);color:var(--accent-ink);border-radius:999px;padding:3px 11px;font-weight:800;font-size:.84rem}
.chip.ok{background:rgba(63,163,77,.2);color:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr));gap:10px;margin-top:14px}
.act.off{opacity:.55}
.act.hi{border-color:var(--accent);background:var(--accent);color:#fff}
.hint{color:var(--muted);font-weight:700}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tab{font:inherit;font-family:var(--display);font-weight:800;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;min-height:44px}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent-ink)}
.wallet{text-align:center;font-weight:800;margin:10px 0 0}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,136px),1fr));gap:10px;margin-top:12px}
.item{font:inherit;font-weight:800;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.item .e,.sticker .e{font-size:2rem;line-height:1.15}
.item small{color:var(--muted);font-weight:800;font-size:.8rem}
.item.used{border-color:var(--accent);background:var(--soft)}
.item.poor{opacity:.6}
.sticker{border:3px dashed var(--line);border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.sticker .e{filter:grayscale(1);opacity:.35}
.sticker.got{border-style:solid;border-color:#E3B23C;background:var(--soft)}
.sticker.got .e{filter:none;opacity:1}
.sticker strong{font-family:var(--display)}
.sticker small{color:var(--muted);font-size:.78rem;line-height:1.25}
.sticker .pr{font-weight:800;color:var(--accent-ink)}
.rank{text-align:center;color:var(--muted);font-weight:800;margin:14px 0 0;font-size:.95rem}
.reset{display:block;margin:8px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer}
[hidden]{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:28px 16px calc(24px + env(safe-area-inset-bottom,0px))}
footer a{color:var(--muted);font-weight:700;text-decoration:none;margin:0 8px}
@media (prefers-reduced-motion:reduce){.btn,.act{transition:none}.need.low .ic,.act.alert::after{animation:none}}
</style>
</head>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var cv=$('scene'),ctx=cv.getContext('2d'),W=960,H=600,FLOOR=520;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function star(x,y,r){ctx.beginPath();for(var i=0;i<10;i++){var a=i*Math.PI/5-Math.PI/2,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();ctx.fill();}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.2,y+s*.2,x-s*.6,y-s*.7,x,y-s*.15);ctx.bezierCurveTo(x+s*.6,y-s*.7,x+s*1.2,y+s*.2,x,y+s*.9);ctx.closePath();ctx.fill();}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function hash(i){var s=Math.sin(i*12.9898+4.1)*43758.5453;return s-Math.floor(s);}
/* Koda-Zeichnung wie in den anderen Koda-Spielen, erweitert um Halsband, Augen und Kleidung */
var FUR='#C0652A',FUR_L='#D27E3F',FUR_D='#9A4D1C',EAR='#8E451A',NOSE='#4A2C22',COLLAR='#4E3424';
function frontLeg(px,py,ang,col){
  // Vorderlauf: Oberarm, gerader Unterarm, Pfote
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(-8,-6);ctx.quadraticCurveTo(-9,14,-5,24);ctx.lineTo(5,24);ctx.quadraticCurveTo(9,10,8,-6);ctx.closePath();ctx.fill();
  ctx.translate(0,22);ctx.rotate(-ang*.6);
  rr(-5,0,10,22,5);ctx.fill();
  ell(3,22,8,4.5);ctx.fill();
  ctx.restore();
}
function hindLeg(px,py,ang,col){
  // Hinterlauf: kräftiger Oberschenkel, schräger Unterschenkel, Sprunggelenk, Pfote
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(-14,-10);ctx.quadraticCurveTo(-18,12,-4,22);ctx.lineTo(8,18);ctx.quadraticCurveTo(14,0,12,-10);ctx.closePath();ctx.fill();
  ctx.translate(2,18);ctx.rotate(.55-ang*.4);
  rr(-5,0,10,20,5);ctx.fill();
  ctx.translate(0,18);ctx.rotate(-.55);
  rr(-4.5,0,9,14,4.5);ctx.fill();
  ell(4,14,8,4.5);ctx.fill();
  ctx.restore();
}
function drawKoda(x,y,run,air,state){
  // x = Mitte, y = Pfoten-Grundlinie, Blick nach rechts
  var s=run,sw=air?0:Math.sin(s),sw2=air?0:Math.sin(s+Math.PI);
  var bob=air?0:-Math.abs(Math.sin(s))*3;
  ctx.save();ctx.translate(x,y+bob);
  if(state.stumble>0)ctx.rotate(-.16*Math.sin(state.stumble*12));
  if(state.blink)ctx.globalAlpha=.55;
  // Schatten
  ctx.save();ctx.translate(0,-bob-(air?state.y:0));ctx.fillStyle='rgba(0,0,0,'+(air?.1:.18)+')';ell(4,2,50,6);ctx.fill();ctx.restore();
  // Rute (dicke Otterrute)
  var wag=Math.sin(state.wag)*.3;
  ctx.save();ctx.translate(-52,-62);ctx.rotate(-.35+wag);
  ctx.fillStyle=FUR;ctx.beginPath();ctx.moveTo(4,-7);ctx.quadraticCurveTo(-22,-12,-42,0);ctx.quadraticCurveTo(-22,2,4,8);ctx.closePath();ctx.fill();
  ctx.restore();
  // ferne Läufe
  hindLeg(-36,-50,air?-.6:sw2*.5,FUR_D);
  frontLeg(36,-50,air?.9:sw*.55,FUR_D);
  // Körper als eine Form: Rücken, Hals, Brust, Bauch, Keule
  ctx.fillStyle=FUR;ctx.beginPath();
  ctx.moveTo(-54,-60);
  ctx.bezierCurveTo(-30,-76,6,-72,30,-76);
  var hd=state.head||0,PX=48,PY=-62;
  function rp(x,y){var dx=x-PX,dy=y-PY,c=Math.cos(hd),s=Math.sin(hd);return [PX+dx*c-dy*s,PY+dx*s+dy*c];}
  var n1=rp(38,-90),n2=rp(46,-106),n3=rp(70,-94),n4=rp(68,-70);
  ctx.quadraticCurveTo(n1[0],n1[1],n2[0],n2[1]);
  ctx.lineTo(n3[0],n3[1]);
  ctx.quadraticCurveTo(n4[0],n4[1],56,-58);
  ctx.quadraticCurveTo(50,-38,32,-36);
  ctx.bezierCurveTo(12,-38,-10,-46,-26,-44);
  ctx.quadraticCurveTo(-46,-34,-58,-46);
  ctx.quadraticCurveTo(-62,-54,-54,-60);
  ctx.closePath();ctx.fill();
  // Licht auf dem Rücken, Schatten am Bauch
  ctx.fillStyle=FUR_L;ctx.beginPath();ctx.moveTo(-46,-64);ctx.bezierCurveTo(-24,-75,6,-71,28,-74);ctx.quadraticCurveTo(4,-66,-46,-60);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(120,50,15,.18)';ell(-2,-44,30,5,-.05);ctx.fill();
  // heller Brustfleck
  ctx.fillStyle='#E9A877';ell(53,-47,3,5,-.4);ctx.fill();
  // nahe Läufe
  hindLeg(-42,-50,air?-.8:sw*.55,FUR);
  frontLeg(30,-48,air?1.05:sw2*.6,FUR);
  // Matsch, Fellbüschel, Kleidung, Zecke
  if(state.over)state.over();
  // Kopf, Halsband und Ohr drehen sich beim Fressen mit

  var s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}

SC.feed={
  enter:function(){this.bag={x:830,y:300,hx:830,hy:300,tilt:0};this.fill=0;this.ph='choose';this.kx=190;this.head=0;this.run=0;this.crunch=0;this.food=FOODS[0];

  pick:function(fd){

    if(fd.bad){sfx.no();flashChoice(fd.k);sayTask(fd.bad);return;}
    this.food=fd;this.ph='pour';hideChoices();sfx.pop();
    sayTask({trocken:'Zieh den Futtersack über den Napf und kipp das Futter hinein!',nass:'Zieh die Dose über den Napf und kipp das Nassfutter hinein!',karotte:'Zieh die Karotten-Tüte über den Napf und kipp sie hinein!'}[fd.k]);
  },
  update:function(dt){
    var b=this.bag;
    if(this.ph==='pour'){
      var held=drag&&drag.obj==='bag',over=held&&Math.abs(b.x-71-BOWLX)<80&&b.y<BOWLY-50;
      b.tilt+=((over?1.25:held?.15:0)-b.tilt)*Math.min(1,dt*8);
      if(!held){b.x+=(b.hx-b.x)*Math.min(1,dt*6);b.y+=(b.hy-b.y)*Math.min(1,dt*6);}
      if(over&&b.tilt>.8){
        this.fill=Math.min(1,this.fill+dt*.42);
        if(Math.random()<dt*45)addP(this.food.p,b.x-71+rnd(-6,6),b.y-20,rnd(-40,10),rnd(20,80),2,{g:900,fl:BOWLY-this.fill*8});
        this.crunch-=dt;if(this.crunch<0){this.crunch=.12;sfx.crunch();}
        if(this.fill>=1){this.ph='walk';drag=null;sfx.ok();sayTask('Voll! Jetzt darf Koda fressen …');}
      }
    }else{b.tilt+=(0-b.tilt)*Math.min(1,dt*6);b.x+=(b.hx-b.x)*Math.min(1,dt*6);b.y+=(b.hy-b.y)*Math.min(1,dt*6);}
    if(this.ph==='walk'){this.kx+=170*dt;this.run+=dt*9;if(this.kx>=BOWLX-185){this.kx=BOWLX-185;this.ph='eat';this.run=0;}}
    else if(this.ph==='eat'){

SC.gassi={

  next:function(){this.ei++;this.ph='walk';},

    this.ph='end';add('gassi',R.gassi);add('fun',R.fun);add('energy',R.energy);add('hunger',R.hunger);

  update:function(dt){
    if(this.ph==='choose'||this.ph==='end')return;
    var e=this.ev[this.ei],sp=0,ps=e.x-this.dist,self=this;
    this.head+=((this.ph==='sniff'?.6:this.ph==='hold'?-.18:this.ph==='meet'&&this.greet>0?.25:0)-this.head)*Math.min(1,dt*6);
    this.sit+=((this.ph==='treat'&&this.treatT>0?1:0)-this.sit)*Math.min(1,dt*8);
    if(this.stum>0)this.stum-=dt;
    if(this.car){this.car.u+=dt/1.4;if(this.car.u>=1)this.car=null;}
    if(this.lunge>=0){this.lunge+=dt;if(this.lunge>=.6)this.lunge=-1;}
    this.ev.forEach(function(x){if(x.leave){x.off+=110*dt;x.run+=dt*8;}if(x.go)x.off+=90*dt;if(x.gone)x.ga=(x.ga||0)+dt;});
    if(this.ph==='walk'){
      sp=150;

        if(ps<900&&!e.seen){e.seen=true;sayTask(JUMPTXT[e.k]);}
        if(ps<=530&&this.jump<0&&this.want){this.jump=0;sfx.bark();}
        if(this.jump<0&&!this.want&&ps<=this.kx&&!e.hit){e.hit=true;this.oops(e.k);}

      else if(e.t==='cross'&&ps<=600){this.ph='cross';this.light='rot';this.lt=rnd(2.2,3.2);this.car={u:0,c:['#3A78B5','#C62828','#F2C230','#4E8F3A'][Math.floor(Math.random()*4)]};
        sayTask('Eine Ampel! Warte, bis das grüne Männchen leuchtet, und tippe dann auf Koda.');}
      else if(e.t==='hold'&&ps<=(e.k==='bark'?640:720)){this.ph='hold';this.hold=0;this.idle=0;this.lunges=0;e.on=true;sayTask(HOLDTXT[e.k]);sfx.bark();}
      else if(e.t==='treat'&&ps<=620){this.ph='treat';this.treatT=0;sayTask('Die Nachbarin hat ein Leckerli! Tippe auf Koda – dann macht er Männchen.');}
      else if(e.t==='tractor'&&ps<=1000){e.go=true;this.ei++;sfx.no();}
      else if(e.t==='meet'){if(ps<1150){e.off+=90*dt;e.run+=dt*8;}
        if(ps-e.off<=this.kx+165+100*e.dog.s){this.ph='meet';this.wait=6;this.greet=0;sayTask(e.dog.n+' kommt! Tippe '+e.dog.er+' an, um Hallo zu sagen.');}}
      else if(e.t==='end'&&ps<=560)this.endWalk();
      if(this.jump>=0){this.jump+=dt;sp=430;if(this.jump>=.8)this.jump=-1;}
      if(this.stum>0)sp=60;
    }
    else if(this.ph==='sniff'){this.wait-=dt;if(this.wait<=0){this.ph='walk';sayTask('Weiter geht’s!');}}
    else if(this.ph==='poop'){this.wait-=dt;if(this.wait<=0&&!this.poop){this.poop={x:this.kx-150,y:this.ky-4};sayTask('Ein Häufchen! Tippe es an und heb es mit dem Beutel auf.');}}

    else if(this.ph==='hold'){
      if(ptrDown){this.hold+=dt;this.idle=0;}else this.idle+=dt;
      if(this.idle>2.5&&this.lunge<0){this.lunge=0;this.lunges++;this.idle=0;sfx.bark();sayTask('Koda zieht an der Leine! Drück auf Koda und halte gedrückt!');}

      if(this.hold>=2){e.gone=true;var good=!this.lunges;if(good){this.bonus++;floatText('+1 ⭐',this.kx+150,this.ky-230,'#C27A00');}
        sayTask(good?'Brav! Koda ist ganz ruhig geblieben.':'Geschafft! Koda geht wieder brav weiter.');this.next();}
    }
    else if(this.ph==='treat'){if(this.treatT>0){this.treatT-=dt;
      if(this.treat){this.treat.u=Math.min(1,this.treat.u+dt/.6);}
      if(this.treatT<=0){add('hunger',5);add('fun',5);this.bonus++;floatText('+1 ⭐',this.kx+150,this.ky-230,'#C27A00');burst('heart',this.kx+140,this.ky-190,5,120);this.treat=null;
        sayTask('Lecker! Koda bedankt sich mit einem Schwanzwedeln.');this.next();}}}
    else if(this.ph==='meet'){
      if(this.greet>0){this.greet-=dt;if(Math.random()<dt*4)addP('heart',this.kx+190,this.ky-200,rnd(-30,30),-70,1,{s:10});if(this.greet<=0){e.leave=true;sayTask('Tschüss, '+e.dog.n+'! Weiter geht’s.');this.next();}}
      else{this.wait-=dt;if(this.wait<=0){e.leave=true;sayTask(e.dog.n+' muss weiter. Weiter geht’s!');this.next();}}

      if(!this.cleaned){ctx.fillStyle='#B3261E';ell(TX,TY,5,5);ctx.fill();
        var pr=1+Math.sin(performance.now()/180)*.08;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=4;ctx.setLineDash([10,8]);ell(TX,TY,62*pr,48*pr);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#FFFFFF';ctx.font='800 26px Outfit, sans-serif';ctx.textAlign='center';ctx.fillText('hier abtupfen',TX,TY-66);}

    if(this.inJar)drawTick(150,465,1.6,1.2);
    if(this.ph==='turn'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=8;ctx.beginPath();ctx.arc(TX,TY,95,0,Math.PI*2);ctx.stroke();
      var pr=Math.min(1,Math.abs(this.turn)/(Math.PI*4));ctx.strokeStyle='#3FA34D';ctx.beginPath();ctx.arc(TX,TY,95,-Math.PI/2,-Math.PI/2+pr*Math.PI*2);ctx.stroke();

      var gx=Math.max(200,f.x-124),dx=gx-this.kx;this.kx+=clamp(dx,-420*dt,420*dt);if(Math.abs(dx)>3)this.run+=dt*14;

var CUPX=[330,490,650],CUPY=470;
SC.cups={
  enter:function(){this.round=0;this.right=0;this.pos=[0,1,2];this.tr=Math.floor(Math.random()*3);this.lift=[0,0,0];this.ph='show';this.t=1.6;this.sw=null;this.left=0;this.pick=-1;this.miss=false;
    sayTask('Schau genau hin: Unter diesem Becher liegt das Leckerli!');},
  cupX:function(i){var s=this.sw;if(s&&(i===s.a||i===s.b)){var u=s.u*s.u*(3-2*s.u),from=CUPX[i===s.a?s.pa:s.pb],to=CUPX[i===s.a?s.pb:s.pa];return from+(to-from)*u;}return CUPX[this.pos[i]];},
  cupY:function(i){var s=this.sw,y=CUPY-this.lift[i]*90;if(s&&(i===s.a||i===s.b))y+=(i===s.a?-1:.4)*Math.sin(Math.PI*s.u)*34;return y;},
  nextSwap:function(){var a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;this.sw={a:a,b:b,pa:this.pos[a],pb:this.pos[b],u:0,d:Math.max(.28,.62-this.round*.1)};tone(500,700,.06,'sine',.04);},
  update:function(dt){
    if(this.ph==='show'){this.lift[this.tr]=Math.min(1,this.lift[this.tr]+dt*4);this.t-=dt;if(this.t<=0)this.ph='lower';}
    else if(this.ph==='lower'){this.lift[this.tr]=Math.max(0,this.lift[this.tr]-dt*4);if(this.lift[this.tr]<=0){this.ph='shuffle';this.left=3+this.round*2;this.nextSwap();sayTask('Jetzt werden die Becher gemischt … gut aufpassen!');}}
    else if(this.ph==='shuffle'){var s=this.sw;s.u+=dt/s.d;if(s.u>=1){var tmp=this.pos[s.a];this.pos[s.a]=this.pos[s.b];this.pos[s.b]=tmp;this.sw=null;this.left--;
      if(this.left>0)this.nextSwap();else{this.ph='pick';sayTask('Wo ist das Leckerli? Tippe auf einen Becher!');}}}
    else if(this.ph==='reveal'){for(var i=0;i<3;i++){var on=i===this.pick||(this.miss&&i===this.tr);this.lift[i]+=((on?1:0)-this.lift[i])*Math.min(1,dt*8);}
      this.t-=dt;if(this.t<=0){this.lift=[0,0,0];this.round++;
        if(this.round>=4){this.ph='end';add('fun',15);track('play');finish('Leckerli-Suche geschafft: '+this.right+' von 4 gefunden!',1+this.right);}
        else{this.tr=Math.floor(Math.random()*3);this.ph='show';this.t=1.3;this.miss=false;this.pick=-1;sayTask('Runde '+(this.round+1)+' von 4: Merk dir den Becher mit dem Leckerli!');}}}
  },
  draw:function(){
    wall('#F6E7CF','#EAD3B2');ctx.fillStyle='#B98552';ctx.fillRect(0,FLOOR-14,W,14);floorWood(FLOOR,'#C89463','#A8743F');
    ctx.fillStyle='#8B5A2B';ctx.fillRect(260,CUPY+14,16,FLOOR-CUPY);ctx.fillRect(704,CUPY+14,16,FLOOR-CUPY);ctx.fillStyle='#A86A35';rr(230,CUPY,520,18,8);ctx.fill();
    koda(110,FLOOR+20,1.5,{head:this.ph==='shuffle'?Math.sin(T*6)*.08:-.05,wag:wagP*(this.ph==='reveal'&&!this.miss?2:1)});
    var self=this,tx=this.cupX(this.tr);
    if(this.lift[this.tr]>.05||this.ph==='show'){ctx.fillStyle='#A86A35';ell(tx-12,CUPY-8,9,7);ctx.fill();ell(tx+12,CUPY-8,9,7);ctx.fill();rr(tx-12,CUPY-13,24,10,5);ctx.fill();}
    [0,1,2].forEach(function(i){var x=self.cupX(i),y=self.cupY(i);
      ctx.fillStyle='#D64535';ctx.beginPath();ctx.moveTo(x-32,y-96);ctx.lineTo(x+32,y-96);ctx.lineTo(x+46,y);ctx.lineTo(x-46,y);ctx.closePath();ctx.fill();
      ctx.fillStyle='#E8675A';ell(x,y-96,32,8);ctx.fill();ctx.fillStyle='#B8352A';ell(x,y,46,8);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(x-20,y-86,8,74);});
  },
  down:function(p){

      else{this.miss=true;sfx.no();sayTask('Leider nicht – das Leckerli war unter dem anderen Becher.');}
      return;}}
  }
};

var TRICKS={sitz:['⬇️','Sitz'],maenn:['🙌','Männchen'],dreh:['🔄','Dreh dich'],spring:['⤴️','Spring'],bell:['🗣️','Gib Laut']};
SC.trick={
  enter:function(){this.round=0;this.seq=[];this.ph='intro';this.t=1.2;this.pose=null;this.pt=0;this.errors=0;this.inp=0;this.stum=0;

  addTricks:function(n){var keys=Object.keys(TRICKS);for(var i=0;i<n;i++){var k;do{k=keys[Math.floor(Math.random()*keys.length)];}while(this.seq.length&&k===this.seq[this.seq.length-1]);this.seq.push(k);}},

        if(this.si<this.seq.length){var k=this.seq[this.si];this.doPose(k);floatText(TRICKS[k][1]+'!',480,140,'#2B2420',46);this.si++;this.t=1.15;}
        else{this.ph='input';this.inp=0;sayTask('Jetzt du! Tippe die '+this.seq.length+' Tricks in der richtigen Reihenfolge.');}}}
    else if(this.ph==='good'||this.ph==='oops'){this.t-=dt;
      if(this.t<=0){if(this.ph==='good'){this.round++;
          if(this.round>=4){this.ph='end';add('fun',15);track('trick');if(!this.errors)track('trickperfect');
            finish(this.errors?'Hundeschule bestanden! Koda kann jetzt '+Object.keys(TRICKS).length+' Tricks.':'Hundeschule ohne einen Fehler – Koda ist Klassenbester!',this.errors?3:4);return;}

SC.thorn={
  enter:function(){this.ph='grab';this.tool={x:800,y:500};this.pull=0;this.plaster={x:820,y:470,hx:820,hy:470};this.out=false;this.thx=THX;this.thy=THY;this.fly=0;

  },
  draw:function(){
    ctx.fillStyle='#FBEFE0';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=DRY[0];ell(480,330,230,200);ctx.fill();
    ctx.fillStyle=DRY[1];ell(420,250,120,70);ctx.fill();

    // Dorn
    var bx=this.thx,by=this.thy;
    ctx.lineCap='round';
    ctx.strokeStyle='#4A3220';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+THD[0]*70,by+THD[1]*70);ctx.stroke();
    ctx.strokeStyle='#E2C08A';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+THD[0]*70,by+THD[1]*70);ctx.stroke();
    ctx.strokeStyle='#4A3220';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx+THD[0]*34,by+THD[1]*34);ctx.lineTo(bx+THD[0]*40+14,by+THD[1]*40+6);ctx.stroke();

    if(this.ph==='plaster'||this.done2){var p=this.plaster;if(!this.done2){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.4);ctx.fillStyle='#F0C99A';rr(-46,-16,92,32,12);ctx.fill();ctx.fillStyle='#E2B07A';rr(-16,-12,32,24,6);ctx.fill();ctx.restore();}}

};

  if(sc.done)return;sc.done=true;addStars(n);sfx.win();
  for(var i=0;i<n+5;i++)addP('star',rnd(260,700),rnd(160,320),rnd(-80,80),rnd(-160,-60),1.4,{g:120,s:rnd(9,15)});
  sayTask(text+' +'+n+' ⭐');$('homeBtn').textContent='🏠 Weiter';doneT=3.2;save();
}
var ALERT={dress:function(){return !outfitOk();},feed:function(){return S.hunger<35;},water:function(){return S.thirst<35;},gassi:function(){return S.gassi<35;},
  play:function(){return S.fun<35;},sleep:function(){return S.energy<30||S.phase===3;},brush:function(){return S.clean<50&&!S.mud;},shower:function(){return S.mud||S.clean<30;},
  claws:function(){return S.claws>75;},vet:function(){return S.sick||S.thorn||S.teeth>75||S.ears>75;},tick:function(){return S.tick;},
  shop:function(){return SHOP.some(function(it){return !S.owned[it.id]&&it.price<=wallet();});}};
var needEls=[].slice.call(document.querySelectorAll('.need'));
var actEls=[].slice.call(document.querySelectorAll('.act'));
function hud(){
  showWx();
  needEls.forEach(function(el){var k=el.getAttribute('data-k'),v=Math.round(S[k]);el.querySelector('i').style.width=v+'%';el.className='need'+(v<30?' low':v<60?' mid':'');el.querySelector('.bar').setAttribute('aria-valuenow',v);});
  actEls.forEach(function(b){var f=ALERT[b.getAttribute('data-go')];b.classList.toggle('alert',!!(f&&f()));});
}
actEls.forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-go'));});});
$('homeBtn').addEventListener('click',function(){go('home');});
$('dressFirst').addEventListener('click',function(){go('dress');});
$('tabShop').addEventListener('click',function(){SC.shop.tab='shop';renderShop();});
$('tabAlbum').addEventListener('click',function(){SC.shop.tab='album';renderShop();});
$('reset').addEventListener('click',function(){if(window.confirm('Wirklich neu anfangen? Kodas Pflegesterne, Sticker und Einkäufe werden zurückgesetzt.')){S=fresh();newWeather();renderTasks();go('home');addStars(0);sayKoda('Hallo, ich bin Koda! Kümmerst du dich heute um mich?',4);}});

function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',function(e){e.preventDefault();var p=pos(e);ptr=p;ptrDown=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}if(sc.down)sc.down(p);});
cv.addEventListener('pointermove',function(e){var p=pos(e),mv=dist(p,ptr);ptr=p;if(ptrDown&&sc.move)sc.move(p,mv);});
function release(e){if(!ptrDown)return;ptrDown=false;var p=pos(e);if(sc.up)sc.up(p);else drag=null;}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

var last=0,hudT=0,saveT=5;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  sess+=dt;T+=dt;if(mode!=='sleep')timeTick(dt);if(petCd>0)petCd-=dt;if(petT>0)petT-=dt;
  var mood=(S.hunger+S.gassi+S.fun+S.energy+S.clean+S.health)/600;wagP+=dt*(3+10*mood+(petT>0?8:0));
  sc.update(dt);updParts(dt);
  if(doneT>0){doneT-=dt;if(doneT<=0)go('home');}
  hudT-=dt;if(hudT<=0){hudT=.25;hud();}
  saveT-=dt;if(saveT<=0){saveT=5;save();}
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.clearRect(0,0,W,H);sc.draw();drawParts();
  requestAnimationFrame(loop);
}
function resize(){var r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.width*H/W*d);if(w>0&&(cv.width!==w||cv.height!==h)){cv.width=w;cv.height=h;}}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('pagehide',save);
resize();addStars(0);showWx();renderTasks();hud();
sayKoda(S.stars?'Da bist du ja wieder! Ich hab dich vermisst.':'Hallo, ich bin Koda! Kümmerst du dich heute um mich?',4);
requestAnimationFrame(loop);
})();
</script>
</body>
